                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested project or session not found in the actor's visible scope.

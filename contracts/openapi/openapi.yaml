  /projects/{project_id}/annotation-revisions/{annotation_revision_id}/review:
    post:
      operationId: reviewAnnotationRevision
      tags:
        - Annotation Tasks
      summary: Record one administrator decision for a submitted annotation revision
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership. The same administrator may
        review their own revision and the audit records SELF_ADMIN_APPROVAL; the video must remain
        undeleted, INGESTED and human-qualified. P0 records one immutable
        APPROVED or REJECTED decision. A rejection returns the task to its assignee; their next
        immutable revision receives the next revision number. An approval completes the task and
        persists the deterministic post-cleaning result for that exact immutable revision. Older
        revisions, reviews and cleaning results remain immutable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationReviewRequest"
      responses:
        "201":
          description: Immutable review decision, or the identical idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationReview"
        "400":
          description: The request or identifiers are invalid.

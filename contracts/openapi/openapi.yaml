      description: >-
        Returns a single bounded read model for the ordinary V1.18 video-management page. The
        ordering is received_at descending and clip_asset_id descending; the opaque cursor encodes
        exactly those two fields. Downstream hand, annotation, cleaning and retention facts are
        read in this page query, so clients do not need one request per video.
      parameters:

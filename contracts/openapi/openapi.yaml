        source_attempt:
          type: integer
          minimum: 1
        recovery_reason:
          type: string
          const: BROKER_MESSAGE_LOST
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]+$
          description: Non-sensitive incident, ticket or deployment reference.
    MediaJobCurrentDeliveryRecoveryRequest:
      type: object
      additionalProperties: false
      required:

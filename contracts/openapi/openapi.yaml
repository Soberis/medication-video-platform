          $ref: "#/components/schemas/AnnotationTaskProgress"
    AnnotationTaskProgress:
      type: object
      additionalProperties: false
      description: >-
        A complete partition of the visible task queue. total equals awaiting_submission plus
        rework_required plus awaiting_review plus completed.
      required:
        - scope
        - total
        - awaiting_submission
        - rework_required
        - awaiting_review
        - completed
      properties:
        scope:
          type: string
          enum:
            - PROJECT
            - ASSIGNEE
          description: PROJECT for an administrator queue; ASSIGNEE for an ordinary member queue.
        total:
          type: integer
          format: int64
          minimum: 0
        awaiting_submission:
          type: integer
          format: int64
          minimum: 0
          description: Assigned tasks without a rejected latest revision.
        rework_required:
          type: integer
          format: int64
          minimum: 0
          description: Assigned tasks whose latest revision was rejected and retained for evidence.
        awaiting_review:
          type: integer
          format: int64
          minimum: 0
          description: Submitted tasks waiting for a project administrator review.
        completed:
          type: integer
          format: int64
          minimum: 0

        - Asset Catalog
      summary: List immutable edge event-log object indexes in one authorized project
      description: >-
        Returns a bounded keyset page ordered by indexed_at and capture_event_log_id descending.
        Each item identifies one verified EVENT_LOG upload object. The service does not parse event
        records, infer hardware actions, expose object-storage locations or return download URLs.
        The authenticated actor must hold an ACTIVE Membership in the explicit project path.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: device_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        - name: indexed_from
          in: query
          description: Inclusive lower bound on server-side indexed_at.
          schema:
            type: string
            format: date-time
        - name: indexed_before
          in: query
          description: Exclusive upper bound on server-side indexed_at.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding CaptureEventLog page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Project-scoped page of immutable event-log object indexes.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureEventLogList"
        "400":
          description: Invalid filter, time range, limit or cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":

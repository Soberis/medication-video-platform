        - clip_asset_id
        - batch_id
        - source_upload_file_id
        - client_file_id
        - content_type
        - size_bytes
        - sha256
        - status
        - session_binding
        - created_at
        - updated_at
      properties:
        clip_asset_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        source_upload_file_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        content_type:
          type: string
          minLength: 1
          maxLength: 128
        size_bytes:
          type: integer

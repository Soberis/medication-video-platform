openapi: 3.1.0
info:
  title: Medication Video Platform API
  version: 0.54.0
  description: >-
    P0 contract for the medication video data platform. Active capabilities create data projects,
    authenticate internal platform accounts with an HttpOnly session, create and manage internal
    MEMBER accounts, manage their ADMIN/MEMBER project memberships, list only projects visible to
    the authenticated member,
    manage one-level project folders and classify ClipAssets without changing media ownership,
    require an ACTIVE project membership for every upload command and an ACTIVE ADMIN membership
    for server-side camera configuration, initialize an upload
    batch, register its immutable file manifest, create an S3-compatible multipart session,
    issue short-lived part upload authorizations, confirm storage-backed parts, recover upload
    progress, complete a file with final size and SHA-256 verification, abort or expire an incomplete
    batch through durable bounded cleanup, complete a verified batch with minimal raw ClipAsset
    bindings, read batch/file upload progress and cleanup state for operator visibility,
    provision immutable server-side CameraChannel and CameraSet configuration identities, atomically
    assemble CaptureSession, CameraSetSnapshot and CameraStream records from a verified uploaded
    metadata object, query explicitly project-scoped CaptureSession, ClipAsset and EVENT_LOG read
    models through ACTIVE Membership with bounded cursor pagination and folder/unclassified asset
    filters, issue an explicitly requested, audited, short-lived video grant to an ACTIVE project
    member for human training-data review after upload-integrity verification, record the current human quality
    conclusion with a stable reason and optimistic version, let project administrators create and
    assign one auditable annotation task for a qualified video, expose the immutable P0 primary-Step
    label schema, let an assignee submit one schema-bound non-overlapping time-range revision, let an
    global ROLE_ADMIN with an ACTIVE project ADMIN membership record one review decision, return a rejected task for a
    later immutable revision, or complete an approved task with a persisted post-cleaning result,
    let project administrators snapshot eligible CaptureSessions into a DRAFT DatasetVersion and
    fix one reproducible CaptureSession-level pilot/holdout split plan and one immutable minimum
    build specification while members read its immutable evidence separately from current admission
    facts, read a non-mutating build-readiness preflight that explains every remaining
    DRAFT-to-BUILDING blocker, explicitly advance a still-ready draft to BUILDING, and seal its
    persisted relational evidence with a deterministic digest before entering VALIDATING, then run
    one immutable freeze-preflight validation over current admission, references, the snapshot digest,
    CaptureSession split isolation and the approved build contract; a PASS creates a pending request
    that a global ROLE_ADMIN with an ACTIVE project ADMIN membership can approve only after atomic revalidation, then
    freeze the version without creating export artifacts or starting a Worker, then record one
    purpose-bound export request, re-evaluate administrator approval readiness, atomically approve
    and queue its first attempt through the Outbox, validate a deterministic Step-only package from
    an independently authenticated Export Worker, and issue an audited short-lived download grant,
    and create and read project-scoped media probe jobs that freeze the input
    digest and size of an uploaded clip asset, exchange a lease-matched Worker identity for a
    short-lived read grant, accept an idempotent media probe result, and query immutable successful
    MediaReport facts, and let an administrator create an audited new attempt from a retained
    sanitized dead-letter diagnostic. The API never proxies upload bytes through the Core API, exposes storage
    locations through catalog reads, controls or probes edge hardware, or performs media processing
    synchronously inside a user request.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: Version 1 API prefix
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Authentication
    description: >-
      Internal platform-account password login, session inspection and logout. Hospital edge devices
      do not use these endpoints; they retain their service credentials for automated uploads.
  - name: Platform Accounts
    description: >-
      Internal account directory. Only a global ADMIN may create MEMBER accounts, list accounts or
      enable and disable MEMBER accounts. This directory never exposes password hashes.
  - name: Projects
    description: >-
      Data-project and ADMIN/MEMBER membership lifecycle owned by the iamproject module. Administrators
      may rename an ACTIVE project or archive it without physically deleting its data; membership
      changes are project-scoped, administrator-controlled, idempotent and append-only audited.
  - name: Uploads
    description: >-
      Upload batch lifecycle owned by the assetcapture module. Every command and read requires an
      ACTIVE membership in the owning project; a batch outside that scope is hidden as
      UPLOAD_BATCH_NOT_FOUND.
  - name: Quality Review
    description: >-
      Project-member human decisions about whether an INGESTED ClipAsset is suitable for annotation
      and training. The current fact is versioned and every change is append-only audited.
  - name: Annotation Tasks
    description: >-
      Minimal project-scoped human annotation queue. A project administrator assigns one task only
      after a ClipAsset is INGESTED and its current human quality conclusion is QUALIFIED. Members
      can read only tasks assigned to themselves.
  - name: Camera Configuration
    description: >-
      Administrative server-side camera identities and immutable set versions. These resources are
      provisioned to an edge device; they do not connect to, control or trigger RK3588 hardware.
  - name: Asset Catalog
    description: Project-scoped read models for nurse medication-preparation sessions and video assets.
  - name: Dataset Admission
    description: >-
      Current-state previews and administrator-created DatasetVersion candidate snapshots. DRAFT
      versions can fix build prerequisites and explicitly enter BUILDING; a completed relational
      snapshot seal advances to VALIDATING, where one technical freeze-preflight result can be
      recorded. A PASS creates a pending request; a global ROLE_ADMIN with an ACTIVE project ADMIN membership can
      revalidate, approve and atomically freeze the version. An administrator can then request the
      fixed P0 export profile for the explicit MODEL_TRAINING purpose and expiry. Members can run a
      no-store approval-readiness check; that administrator may then atomically approve
      and queue v2. AVAILABLE means the Core API verified the package before an administrator can
      request a short-lived audited download grant.
  - name: Video Playback
    description: >-
      Explicit, short-lived raw-video access for an internal account with ACTIVE project membership.
      It is for human review, not download, annotation or a privacy-release decision.
  - name: Asset Folders
    description: >-
      One-level project-scoped ClipAsset classification owned by assetcapture. Folders never grant
      access, map to object storage paths or change a ClipAsset project.
  - name: Media Jobs
    description: >-
      Project-scoped media probe job lifecycle owned by the mediaprivacy module. Creation freezes
      the input and approved recipe, persists attempt 1 and a versioned dispatch envelope through
      the Transactional Outbox, and returns QUEUED. RabbitMQ is a delivery mechanism rather than
      the business state store; successful completion requires a lease-matched, approved Worker
      result to be validated and committed by the Core API.
paths:
  /projects/{project_id}/dataset-versions:
    get:
      operationId: listDatasetVersions
      tags:
        - Dataset Admission
      summary: List project-scoped dataset versions
      description: >-
        Requires ACTIVE project membership. Returns DRAFT, BUILDING, VALIDATING and FROZEN metadata; it does not
        mutate a DatasetVersion, create an export or authorize data release.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Dataset versions visible to the current active project member.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionList"
        "400":
          description: The cursor or pagination parameters are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
    post:
      operationId: createDatasetVersionDraft
      tags:
        - Dataset Admission
      summary: Create an eligible capture-session candidate snapshot as a dataset draft
      description: >-
        Requires ACTIVE ADMIN membership. Every supplied CaptureSession is re-evaluated against
        current admission facts, then its session and stream evidence is persisted as an immutable
        DRAFT candidate snapshot. This endpoint neither freezes the DatasetVersion nor assigns
        splits, approves an exception, creates an export or authorizes data release.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetVersionCreateRequest"
      responses:
        "201":
          description: Dataset draft and its immutable candidate snapshot were created.
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersion"
        "400":
          description: Request syntax is invalid or a capture-session ID is duplicated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not a global administrator with ACTIVE project ADMIN membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or a selected CaptureSession is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: A selected CaptureSession is not eligible or the idempotency key conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}:
    get:
      operationId: getDatasetVersion
      tags:
        - Dataset Admission
      summary: Read an immutable DatasetVersion evidence snapshot
      description: >-
        Requires ACTIVE project membership. Returns the DatasetVersion's persisted session and stream
        evidence snapshot and its immutable split plan when one exists, without resolving current
        mutable facts or exposing media URLs.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
      responses:
        "200":
          description: Immutable candidate evidence snapshot.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionDetail"
        "400":
          description: A path parameter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/split-plans:
    post:
      operationId: createDatasetSplitPlan
      tags:
        - Dataset Admission
      summary: Fix one reproducible pilot/holdout plan for a dataset draft
      description: >-
        Requires ACTIVE ADMIN membership. Creates exactly one immutable split plan for a DRAFT with
        at least two candidate CaptureSessions. CAPTURE_SESSION_HASH_RANK_V1 treats each
        CaptureSession as one leakage group, persists a positive random seed, ranks all groups by a
        stable SHA-256 key and assigns the requested number of lowest-ranked groups to HOLDOUT; all
        remaining groups are PILOT. Replaying the same request with the same idempotency key returns
        the same plan. A different plan requires a new DatasetVersion. This endpoint does not freeze
        the draft, create an export or authorize data release.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetSplitPlanCreateRequest"
      responses:
        "201":
          description: The immutable split plan was created or replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSplitPlan"
        "400":
          description: The request syntax, path parameter, header or holdout count is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The draft has too few members, the holdout count would leave a split empty, a plan
            already exists, or the idempotency key conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/current-admission:
    get:
      operationId: getDatasetVersionCurrentAdmission
      tags:
        - Dataset Admission
      summary: Read current admission facts and DatasetVersion build readiness
      description: >-
        Requires ACTIVE project membership. Re-evaluates every persisted DatasetVersion member against current
        admission facts, reports stable evidence differences from its immutable candidate snapshot and
        summarizes the DRAFT-to-BUILDING prerequisites. This remains useful after start for detecting
        later evidence changes and is a read-only observation: it
        does not fix a selection, label, cleaning or export profile, write audit events, change the
        DatasetVersion, assign splits, approve an exception, freeze a DatasetVersion, create an export or
        authorize data release.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
      responses:
        "200":
          description: Current facts, snapshot differences and the non-mutating build-readiness preflight.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionCurrentAdmission"
        "400":
          description: A path parameter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/build-specifications:
    post:
      operationId: createDatasetBuildSpecification
      tags:
        - Dataset Admission
      summary: Fix the minimum immutable build configuration for a dataset draft
      description: >-
        Requires ACTIVE ADMIN membership. After one immutable split plan exists, binds the explicit
        candidate snapshot selection rule, the one common label-schema digest, the one common
        cleaning-rule digest, that split plan and the current p0-dataset-export-v2 Step-only profile
        to the DRAFT. Historical v1 specifications remain readable and idempotently replayable. The
        command does not advance the DatasetVersion to BUILDING, re-evaluate current admission,
        freeze data, create files, start a Worker or authorize data release.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "201":
          description: The immutable build specification was created or replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetBuildSpecification"
        "400":
          description: A path parameter or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The draft has no split plan, its label or cleaning evidence is not uniform, a build
            specification already exists, its status is not DRAFT, or the idempotency key conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/build:
    post:
      operationId: startDatasetVersionBuild
      tags:
        - Dataset Admission
      summary: Advance one ready dataset draft to BUILDING
      description: >-
        Requires ACTIVE ADMIN membership. Locks the project, verifies that the DatasetVersion is
        still DRAFT, re-evaluates current admission and every immutable-evidence difference, and
        advances the version to BUILDING only when the fixed selection, label, cleaning, split and
        export-profile prerequisites remain satisfied. The command records the actor, time,
        idempotency fingerprint and an audit event in the same transaction. Replaying the same
        request returns the original result. BUILDING seals the draft configuration; this command
        does not create files, start a Worker, validate or freeze the dataset, approve release or
        export data.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "200":
          description: The build was started or the same command was replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionBuildStart"
        "400":
          description: A path parameter or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The version is no longer DRAFT, a current admission or immutable-evidence prerequisite
            is blocked, or the idempotency key was used for another dataset version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/build-snapshots:
    post:
      operationId: createDatasetBuildSnapshot
      tags:
        - Dataset Admission
      summary: Seal the immutable relational build snapshot
      description: >-
        Requires ACTIVE ADMIN membership and a BUILDING DatasetVersion. Locks the project, verifies
        that the fixed members, raw ClipAsset inputs, annotation revisions, cleaning evidence,
        leakage groups, split assignments and build specification form one complete relational
        snapshot, then stores a versioned deterministic SHA-256 seal and advances the DatasetVersion
        to VALIDATING in the same transaction. The P0 input policy uses each already-verified raw
        ClipAsset ID and digest; this command does not create a derived AssetVariant, files, a Worker
        job, a freeze approval or an export. Replaying the same idempotency key returns the original
        immutable snapshot.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "201":
          description: The immutable build snapshot was created or replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetBuildSnapshot"
        "400":
          description: A path parameter or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The version is not BUILDING, the fixed relational evidence is incomplete or inconsistent,
            a snapshot already exists, or the idempotency key was used for another dataset version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/validations:
    post:
      operationId: validateDatasetVersion
      tags:
        - Dataset Admission
      summary: Record the immutable freeze-preflight validation
      description: >-
        Requires ACTIVE ADMIN membership and a VALIDATING DatasetVersion. Locks the project and runs
        the versioned DATASET_FREEZE_VALIDATION_V1 checks against current admission, fixed-reference
        integrity, the recomputed relational snapshot digest, CaptureSession-level split isolation
        and the approved P0 build contract. It stores exactly one immutable PASS or FAIL result and
        an audit event. A created result may be FAIL; HTTP 201 only means the validation fact was
        recorded. PASS also creates one pending freeze request with the validator as requester, but
        does not approve, freeze or export the version. FAIL must be addressed in a new DatasetVersion
        rather than by overwriting this result. Replaying the same idempotency key returns the
        original result.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "201":
          description: The PASS or FAIL validation result was created or replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionValidation"
        "400":
          description: A path parameter or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The version is not VALIDATING, its fixed snapshot is unavailable, a validation result
            already exists, or the idempotency key was used for another dataset version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/freezes:
    post:
      operationId: freezeDatasetVersion
      tags:
        - Dataset Admission
      summary: Approve and freeze a validated dataset version
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership, a VALIDATING DatasetVersion,
        an immutable PASS result and its pending freeze request. The same administrator may approve
        their own request; that fact is retained as SELF_ADMIN_APPROVAL in the append-only audit.
        The command locks the project, reruns current admission,
        reference, snapshot-digest, CaptureSession split-isolation and build-contract checks, records
        one APPROVED decision and advances the version to FROZEN in the same transaction. A changed
        fact blocks the command and requires a new DatasetVersion. FROZEN members, revisions, rules
        and split remain immutable; this command creates no files, export authorization, Worker or
        queue task. Replaying the same idempotency key returns the original frozen result.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "201":
          description: The administrator approval was recorded and the DatasetVersion is FROZEN.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionFreeze"
        "400":
          description: A path parameter or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:

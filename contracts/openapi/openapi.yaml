        capture_group_id:
          type: string
          format: uuid
        capture_group_version:
          type: integer
          format: int64
          minimum: 0
        camera_set_snapshot_id:
          type: string
          format: uuid
        receipt_state:
          $ref: "#/components/schemas/CaptureGroupReceiptState"
        views:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/CaptureGroupQualityView"
    CaptureGroupQualityReviewRequest:
      type: object
      additionalProperties: false
      required:

openapi: 3.1.0
info:
  title: Medication Video Platform API
  version: 0.25.0
  description: >-
    P0 contract for the medication video data platform. Active capabilities create data projects,
    authenticate internal platform accounts with an HttpOnly session, manage their ADMIN/MEMBER
    memberships, list only projects visible to the authenticated member,
    manage one-level project folders and classify ClipAssets without changing media ownership,
    require an ACTIVE project membership for every upload command and an ACTIVE ADMIN membership
    for server-side camera configuration, initialize an upload
    batch, register its immutable file manifest, create an S3-compatible multipart session,
    issue short-lived part upload authorizations, confirm storage-backed parts, recover upload
    progress, complete a file with final size and SHA-256 verification, abort or expire an incomplete
    batch through durable bounded cleanup, complete a verified batch with minimal raw ClipAsset
    bindings, read batch/file upload progress and cleanup state for operator visibility,
    provision immutable server-side CameraChannel and CameraSet configuration identities, atomically
    assemble CaptureSession, CameraSetSnapshot and CameraStream records from a verified uploaded
    metadata object, query explicitly project-scoped CaptureSession, ClipAsset and EVENT_LOG read
    models through ACTIVE Membership with bounded cursor pagination and folder/unclassified asset
    filters, and create and read project-scoped media probe jobs that freeze the input
    digest and size of an uploaded clip asset, exchange a lease-matched Worker identity for a
    short-lived read grant, accept an idempotent media probe result, and query immutable successful
    MediaReport facts, and let an administrator create an audited new attempt from a retained
    sanitized dead-letter diagnostic, record versioned human privacy assessments against an immutable
    ingested clip digest without granting annotation or export access, and let an administrator read
    the active project-scoped quarantine state derived from those assessments. The API never proxies upload bytes through the Core API, exposes storage
    locations through catalog reads, controls or probes edge hardware, or performs media processing
    synchronously inside a user request.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: Version 1 API prefix
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Authentication
    description: >-
      Internal platform-account password login, session inspection and logout. Hospital edge devices
      do not use these endpoints; they retain their service credentials for automated uploads.
  - name: Projects
    description: >-
      Data-project and ADMIN/MEMBER membership lifecycle owned by the iamproject module. Membership
      changes are project-scoped, administrator-controlled, idempotent and append-only audited.
  - name: Uploads
    description: >-
      Upload batch lifecycle owned by the assetcapture module. Every command and read requires an
      ACTIVE membership in the owning project; a batch outside that scope is hidden as
      UPLOAD_BATCH_NOT_FOUND.
  - name: Camera Configuration
    description: >-
      Administrative server-side camera identities and immutable set versions. These resources are
      provisioned to an edge device; they do not connect to, control or trigger RK3588 hardware.
  - name: Asset Catalog
    description: Project-scoped read models for nurse medication-preparation sessions and video assets.
  - name: Asset Folders
    description: >-
      One-level project-scoped ClipAsset classification owned by assetcapture. Folders never grant
      access, map to object storage paths or change a ClipAsset project.
  - name: Media Jobs
    description: >-
      Project-scoped media probe job lifecycle owned by the mediaprivacy module. Creation freezes
      the input and approved recipe, persists attempt 1 and a versioned dispatch envelope through
      the Transactional Outbox, and returns QUEUED. RabbitMQ is a delivery mechanism rather than
      the business state store; successful completion requires a lease-matched, approved Worker
      result to be validated and committed by the Core API.
  - name: Privacy Assessments
    description: >-
      Project-scoped, administrator-controlled human risk assessments. An assessment is append-only,
      binds the ingested clip digest and an approved policy digest, and always leaves privacy release
      BLOCKED until a separate release decision is implemented and approved.
  - name: Quarantines
    description: >-
      Administrator-only, project-scoped read model for active clip-asset quarantine records. This
      contract does not expose quarantine creation, release or destruction commands.
paths:
  /auth/login:
    post:
      operationId: loginPlatformAccount
      tags:
        - Authentication
      summary: Start an internal platform-account session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Authenticated session. The response sets the XSRF-TOKEN Cookie used for subsequent browser commands.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
        "400":
          description: Login request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The username or password is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/session:
    get:
      operationId: getPlatformSession
      tags:
        - Authentication
      summary: Read the current internal platform-account session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
        "401":
          description: No authenticated session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutPlatformAccount
      tags:
        - Authentication
      summary: End the current internal platform-account session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session ended.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          description: No authenticated session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects:
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Create a data project
      description: >-
        Creates an ACTIVE project and grants the authenticated provisioning administrator its first
        ADMIN membership in one transaction. Reusing the Idempotency-Key with the same request
        returns the original project; different content returns a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Project created, or the original project returned for an idempotent replay.
          headers:
            Location:
              description: Canonical project resource path.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Request, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provisioning administrator authority is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key was already used with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: List projects visible to the authenticated member
      description: >-
        Returns only ACTIVE projects with an ACTIVE membership for the authenticated actor, plus the
        server-evaluated capability to create a project.
      responses:
        "200":
          description: Authorized projects, ordered deterministically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}:
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Read an authorized project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Authorized project and the caller's current role.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The project identifier is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/memberships:
    get:
      operationId: listProjectMemberships
      tags:
        - Projects
      summary: List project memberships
      description: Requires an ACTIVE ADMIN membership in the project.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: ACTIVE membership records ordered deterministically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipList"
        "400":
          description: The project identifier is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/memberships/{actor_id}:
    put:
      operationId: upsertProjectMembership
      tags:
        - Projects
      summary: Grant, reactivate or change a project membership
      description: >-
        Requires an ACTIVE ADMIN membership. The command is idempotent per project, administrator
        and Idempotency-Key. Demoting the final ACTIVE administrator is rejected.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipRequest"
      responses:
        "200":
          description: Membership state after the command, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          description: Request, path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The idempotency key conflicts with another command, or the command would remove the
            final ACTIVE administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeProjectMembership
      tags:
        - Projects
      summary: Remove a project membership
      description: >-
        Requires an ACTIVE ADMIN membership. Removal preserves the membership record and audit
        history. Removing the final ACTIVE administrator is rejected.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "200":
          description: Removed membership state, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          description: Path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or target membership does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The idempotency key conflicts with another command, or the command would remove the
            final ACTIVE administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/asset-folders:
    get:
      operationId: listAssetFolders
      tags:
        - Asset Folders
      summary: List one-level folders in an authorized project
      description: Requires an ACTIVE project membership. The list contains no nested folders.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project folders ordered by display name and folder identity.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetFolderList"
        "400":
          description: The project identifier is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAssetFolder
      tags:
        - Asset Folders
      summary: Create a one-level project folder
      description: >-
        Requires an ACTIVE ADMIN membership. Folder names are unique case-insensitively within the
        project. Replaying the same command returns its original result.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetFolderRequest"
      responses:
        "201":
          description: Folder created, or the original folder returned for an idempotent replay.
          headers:
            Location:
              description: Canonical asset-folder resource path.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetFolder"
        "400":
          description: Request, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The folder name exists or the idempotency key conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/asset-folders/{folder_id}:
    put:
      operationId: renameAssetFolder
      tags:
        - Asset Folders
      summary: Rename a project folder
      description: Requires an ACTIVE ADMIN membership and preserves the stable folder identity.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FolderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetFolderRequest"
      responses:
        "200":
          description: Folder state after rename, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetFolder"
        "400":
          description: Request or path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or folder does not exist in the authorized scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The folder name exists or the idempotency key conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAssetFolder
      tags:
        - Asset Folders
      summary: Delete a project folder and unclassify its ClipAssets
      description: >-
        Requires an ACTIVE ADMIN membership. The transaction clears folder_id on every classified
        ClipAsset before deleting the folder; it never deletes or moves a media object.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FolderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "204":
          description: Folder deleted and its ClipAssets made unclassified, including a replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: Path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or folder does not exist in the authorized scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/clip-assets/{clip_asset_id}/folder:
    put:
      operationId: assignClipAssetFolder
      tags:
        - Asset Folders
      summary: Move a ClipAsset into a folder in its project
      description: >-
        Requires an ACTIVE ADMIN membership. The target folder and ClipAsset must belong to the path
        project. Only folder_id changes; project, media object and downstream facts are unchanged.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ClipAssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipAssetFolderRequest"
      responses:
        "200":
          description: ClipAsset classification after the move, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetFolder"
        "400":
          description: Request or path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project, ClipAsset or target folder does not exist in the authorized scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unclassifyClipAsset
      tags:
        - Asset Folders
      summary: Move a ClipAsset to the unclassified project view
      description: >-
        Requires an ACTIVE ADMIN membership. Unclassified is represented by a null folder_id and is
        not a deletable system folder.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ClipAssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "200":
          description: Unclassified ClipAsset state, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetFolder"
        "400":
          description: Path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or ClipAsset does not exist in the authorized scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/init:
    post:
      operationId: initializeUploadBatch
      tags:
        - Uploads
      summary: Initialize an upload batch
      description: >-
        Requires an ACTIVE ADMIN or MEMBER membership in project_id. Creates a durable upload batch
        identity without proxying file bytes or starting multipart upload. Reusing the same
        Idempotency-Key in the same project with an identical request returns the original result.
        Reusing it with different content returns a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadBatchInitRequest"
      responses:
        "201":
          description: >-
            Batch initialized. An idempotent replay returns the same status and response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatch"
        "400":
          description: Request or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist in the caller's ACTIVE membership scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key was already used with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}:
    get:
      operationId: getUploadBatchProgress
      tags:
        - Uploads
      summary: Read upload batch progress
      description: >-
        Requires an ACTIVE membership in the batch's owning project and returns the current
        project-scoped batch summary derived from persisted platform state.
        This safe read does not list or mutate object storage. Uploaded Part and byte totals may
        therefore lag a direct upload until the client explicitly confirms or reconciles Parts.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current persisted batch progress.
          headers:
            Cache-Control:
              description: Prevents clients from displaying stale operational progress.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatchProgress"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/abort:
    put:
      operationId: abortUploadBatch
      tags:
        - Uploads
      summary: Terminate an incomplete upload batch and durably schedule storage cleanup
      description: >-
        Idempotently terminates an INITIATED or UPLOADING batch. Only the recorded batch initiator
        with an ACTIVE membership or an ACTIVE project ADMIN may call this command. A local token's
        global authority is not treated as project administration. If the server TTL has already
        elapsed, the command records EXPIRED rather than incorrectly recording a user abort.
        Batch and file terminal states, cleanup tasks and an append-only audit event commit in one
        database transaction; S3 Multipart Abort or deletion of an already completed abandoned
        object happens asynchronously through bounded, leased retries. An active file completion
        lease blocks termination. The command never returns storage identifiers or signed URLs.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      responses:
        "200":
          description: >-
            Batch is ABORTED or EXPIRED and cleanup is either unnecessary, pending, running,
            successful or terminally failed after bounded retry.
          headers:
            Cache-Control:
              description: Prevents storage of mutable cleanup state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatchTermination"
        "400":
          description: Path or request ID validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is neither the batch initiator nor a project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Batch is completed or otherwise not abortable, or a file completion lease is active.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files:
    get:
      operationId: listUploadFileProgress
      tags:
        - Uploads
      summary: List file progress for an upload batch
      description: >-
        Returns deterministic file summaries with persisted Part counts, confirmed bytes, file
        lifecycle state and stable completion error codes. This read does not contact object
        storage; use the explicit Part reconciliation command after an interrupted direct upload.
        Detailed Part records remain available from the per-file Part progress resource.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current persisted file progress ordered by registration time and file ID.
          headers:
            Cache-Control:
              description: Prevents clients from displaying stale operational progress.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileProgressList"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/completion:
    put:
      operationId: completeUploadBatch
      tags:
        - Uploads
      summary: Complete a verified upload batch and bind raw video assets
      description: >-
        Called automatically by the edge uploader after every declared file has completed final
        object size and full-file SHA-256 verification. The command locks the batch, checks exact
        file count and total bytes, verifies the upload-file-manifest-v1 digest, and creates one
        immutable minimal RAW ClipAsset binding for each VIDEO file and one immutable CaptureEventLog
        object index for each EVENT_LOG file. METADATA remains an uploaded source object for session
        ingestion. EVENT_LOG payloads are not interpreted and do not become ClipAssets.
        The natural-resource PUT is idempotent: a replay returns the persisted completion and never
        creates duplicate assets. It does not perform media probing or create a CaptureSession.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch completed and raw video files bound to minimal ClipAssets, or replayed idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of mutable operational state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatchCompletion"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The batch state, registered declaration, file completion state, manifest digest or
            required VIDEO file does not satisfy completion guards.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/capture-session:
    put:
      operationId: ingestCaptureSession
      tags:
        - Uploads
      summary: Assemble one capture session from verified uploaded metadata
      description: >-
        For HOSPITAL_REMOTE batches, this operation locates exactly one uploaded
        METADATA file with application/json content type, enforces a 1 MiB safety limit, reads it
        from object storage, verifies its already-recorded size and SHA-256 again, and parses the
        strict capture-session-metadata-v1 schema. It then validates device_id against the batch,
        validates camera_set_id, expected_camera_count, layout version, enabled channels and camera
        indices against immutable server configuration, and requires every VIDEO ClipAsset in the
        batch to be bound exactly once. CaptureSession, CameraSetSnapshot, snapshot members and
        CameraStreams are created in one database transaction. Edge-reported synchronization data
        is retained as an observation and does not override server configuration or become a
        verified sync revision. Newly uploaded, unprobed assets produce BOUND streams and are not
        counted in received_camera_count until later media ingest. A natural-resource replay returns
        the original assembly without rereading object storage. The operation does not control the
        RK3588 device or accept video bytes through the Core API. For PLATFORM_LOCAL batches,
        it creates one server-defined single-view CaptureSession for the one verified VIDEO asset;
        no edge metadata, capture time, or multi-camera relationship is inferred.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Capture session assembled atomically, or the existing assembly returned idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of mutable ingest and quality state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSession"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The upload batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The batch is not completed, the metadata object or schema is invalid, the server
            CameraSet does not match, or video assets cannot be bound one-to-one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not read the verified metadata object; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}:
    put:
      operationId: registerUploadFile
      tags:
        - Uploads
      summary: Register one immutable file manifest entry
      description: >-
        Registers control-plane metadata for one file in an initialized batch and calculates the
        expected number of parts. This operation does not proxy bytes, create an object-storage
        multipart session, issue a signed URL or move the batch to UPLOADING. Replaying the same
        resource and content returns the original result; changing immutable content returns a
        conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          description: Stable UUID assigned by the edge client for this source file.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFileRegistrationRequest"
      responses:
        "201":
          description: File manifest entry registered or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFile"
        "400":
          description: Header, path or file metadata validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Immutable file content conflicts, the idempotency key was reused, the batch declaration
            would be exceeded, or the batch no longer accepts manifest entries.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/multipart:
    put:
      operationId: startMultipartUpload
      tags:
        - Uploads
      summary: Create the file's object-storage multipart session
      description: >-
        Creates at most one S3-compatible multipart session for a registered file. Every file and
        byte declared by the batch manifest must already be registered. This natural-resource PUT
        is replay-safe, does not expose the storage upload ID, does not issue upload credentials and
        leaves the batch in INITIATED until a part authorization is successfully issued.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Multipart session created or the existing session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMultipartSession"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The manifest is incomplete, expired or not in an uploadable state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not create the multipart session; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/completion:
    put:
      operationId: completeUploadFile
      tags:
        - Uploads
      summary: Complete and verify one multipart file
      description: >-
        Acquires a bounded completion lease, reads the authoritative current Part list from object
        storage, requires continuous Part numbers and exact manifest size, and submits those current
        ETags to S3 CompleteMultipartUpload. It then inspects and streams the completed object to
        calculate the full-file SHA-256. A multipart ETag is never treated as a SHA-256. Identical
        replays return the persisted result, and a retry can recover when object storage completed
        before the platform persisted success.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File completed and final object integrity verified, or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileCompletion"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Parts are incomplete or divergent, another completion lease is active, or final size or
            SHA-256 verification failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not list, complete, inspect or stream the object; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/{part_number}/authorization:
    post:
      operationId: authorizeUploadPart
      tags:
        - Uploads
      summary: Authorize a direct upload of one immutable part
      description: >-
        Registers the expected SHA-256 for a part and returns a short-lived pre-signed PUT URL.
        Repeating the same part and hash reissues a fresh authorization; changing the hash returns
        a conflict. The response is a temporary credential, must not be logged or persisted by the
        caller, and is returned with Cache-Control: no-store. The first successful authorization
        moves the file and batch to UPLOADING.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPartAuthorizationRequest"
      responses:
        "200":
          description: A fresh direct-upload authorization was issued.
          headers:
            Cache-Control:
              description: Prevents storage of the temporary credential response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartAuthorization"
        "400":
          description: Path or checksum validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The session is missing, the part is out of range or immutable metadata conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not sign the part authorization; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/{part_number}/confirmation:
    put:
      operationId: confirmUploadPart
      tags:
        - Uploads
      summary: Confirm one part from object-storage state
      description: >-
        Queries object storage for the authorized part and records it as UPLOADED only when the
        stored part number and byte length match the immutable manifest. The caller does not submit
        an ETag, so client-controlled metadata cannot confirm missing bytes. An identical replay is
        safe. The declared part SHA-256 is not treated as independently verified until final file
        integrity verification.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
      responses:
        "200":
          description: The storage-backed part was confirmed or returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedUploadPart"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The part was not authorized, is missing from storage, has the wrong size or conflicts
            with a prior confirmation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not inspect the part; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts:
    get:
      operationId: getUploadPartProgress
      tags:
        - Uploads
      summary: Read persisted multipart progress
      description: >-
        Returns the current platform record for authorized and confirmed parts without issuing
        credentials or changing upload state. After an interrupted client reconnects, it should
        reconcile storage state first and then use this representation to decide which parts still
        need authorization and upload.

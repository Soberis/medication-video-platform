                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/annotation-revisions/{annotation_revision_id}/capture-group-cleaning-rechecks:
    post:
      operationId: recheckCaptureGroupEventCleaning
      tags:
        - Annotation Tasks
      summary: Re-evaluate CaptureGroup event eligibility without caller mappings
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership. The revision must be an APPROVED,
        completed CaptureGroup AnnotationRevision. Primary intervals always come from the primary view's
        AnnotationRevision. Supporting Views are event-level evidence only. The deprecated compatibility
        support_mappings input must be omitted or empty; a non-empty caller-supplied mapping is rejected
        with 422 and can never create an action-aligned timestamp. Declared synchronization is evidence
        only, not a calibrated or frame-synchronized mapping. The raw media and rejected views are retained.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureGroupCleaningRequest"
      responses:
        "200":
          description: Current immutable event-cleaning result or idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureGroupCleaning"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Caller-supplied supporting-view mappings are unsupported in the V1.28 MVP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The revision is not an approved completed CaptureGroup revision.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/clip-assets/{clip_asset_id}/quality-review:
    get:
      operationId: getClipAssetQualityReview
      tags:
        - Quality Review
      summary: Read the current human quality conclusion for a video
      description: >-
        Requires an ACTIVE ADMIN or MEMBER membership in the explicit project. An undeleted asset
        without a conclusion returns UNREVIEWED with version 0. The response never exposes storage
        details.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ClipAssetId"
      responses:
        "200":
          description: Current quality-review fact or the explicit UNREVIEWED projection.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReview"
        "401":
          description: No authenticated platform session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated account has no ACTIVE membership in the project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or undeleted ClipAsset is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: recordClipAssetQualityReview
      tags:
        - Quality Review
      summary: Record or revise the human quality conclusion for a video
      description: >-
        Requires an ACTIVE ADMIN or MEMBER membership. The asset must be undeleted and INGESTED.
        expected_version is 0 for an unreviewed asset and must match the current review version for
        a revision. Repeating the same conclusion returns the current fact without another audit
        event. A changed conclusion is written atomically with an append-only audit event. A new or changed
        QUALIFIED conclusion also atomically creates exactly one AnnotationTask assigned to the qualifying
        member and appends its audit evidence. That task never creates an AnnotationRevision, Review,
        Cleaning result or training-data eligibility; those remain separately guarded human/system facts.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ClipAssetId"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityReviewRequest"
      responses:
        "200":
          description: The current quality conclusion after the command.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReview"
        "400":
          description: The decision, reason or expected version is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No authenticated platform session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated account has no ACTIVE membership in the project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or undeleted ClipAsset is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The asset is not INGESTED or the expected review version is stale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs:
    post:
      operationId: createMediaJob
      tags:
        - Media Jobs
      summary: Create a media probe job for a verified uploaded clip asset
      description: >-
        Persists a media job, attempt 1 and an Outbox dispatch envelope atomically for the
        authenticated project, then returns the durable QUEUED state. The job is uniquely
        identified by the (project_id, job_type, clip_asset_id, input_digest, recipe_digest)
        tuple; the server binds it to the approved media-probe-baseline-v1 profile and returns an
        existing job with the same tuple idempotently. Callers cannot supply arbitrary probe
        recipes. The same Idempotency-Key reused with a different request body is rejected with
        IDEMPOTENCY_KEY_REUSED. The dispatch envelope contains only project/asset identities,
        digests, approved profile identity and the attempt lease token; it does not expose object
        storage locations or signed URLs. Its contract is media-probe-job-v1.schema.json and the
        Worker result contract is media-probe-result-v1.schema.json.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobRequest"
      responses:
        "202":
          description: Job durably queued through the Transactional Outbox or returned idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
            Location:
              schema:
                type: string
                format: uri-reference
              description: Canonical URL of the created job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "400":
          description: The request body or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not authorized for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The referenced clip asset was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The Idempotency-Key was reused with a different request body, or the clip asset is
            not in a probeable state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}:
    get:
      operationId: getMediaJob
      tags:
        - Media Jobs
      summary: Read a media probe job by id
      description: >-
        Returns the persisted job for the authenticated project. This read operation does not
        dispatch, retry or transition the job. The current attempt exposes safe terminal diagnostics
        but never exposes lease tokens, Worker identifiers or storage locations.
      parameters:
        - name: media_job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media job detail.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/replays:
    post:
      operationId: replayDeadLetteredMediaJob
      tags:
        - Media Jobs
      summary: Create an audited new attempt from a retained sanitized dead-letter diagnostic
      description: >-
        Administrator-only recovery command. The caller copies only the safe identity fields from
        a retained media-dead-letter.v1 diagnostic. The server verifies the deterministic
        dead_letter_id, current job/message/attempt identity, project boundary, replay limit and
        idempotency key; it then marks the old attempt failed and atomically creates a new attempt,
        lease capability, message ID, Outbox event, replay record and append-only audit event. The
        DLQ body is never republished, and the original diagnostic remains immutable evidence.
        Invalid-contract diagnostics without a trusted job identity cannot be replayed through this
        endpoint.
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          description: Optional caller correlation id copied into the audit event.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobReplayRequest"
      responses:
        "202":
          description: New attempt queued, or the exact command replayed idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobReplayResponse"
        "400":
          description: The diagnostic fields, change reference or idempotency key are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The diagnostic does not match the current attempt, the replay limit or job state was
            reached, or the idempotency key/dead-letter identity conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/delivery-recoveries:
    post:
      operationId: recoverMissingMediaJobDelivery
      tags:
        - Media Jobs
      summary: Replace one confirmed missing broker delivery with a new audited attempt
      description: >-
        Administrator-only disaster-recovery command for a current QUEUED attempt whose
        publisher-confirmed RabbitMQ message is known to be absent. The server does not inspect
        broker queues or republish automatically. It locks the current project/job/attempt, marks
        only the source attempt failed with BROKER_MESSAGE_LOST, creates a fresh attempt, lease
        capability, message ID and Outbox envelope, and records immutable recovery and audit facts.
        A source message can be recovered once; the normal maximum-attempt policy remains in force.
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobDeliveryRecoveryRequest"
      responses:
        "202":
          description: A new attempt was queued, or the exact recovery command was replayed idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobDeliveryRecoveryResponse"
        "400":
          description: The recovery command or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The source is stale, already recovered, non-queued, or reached its attempt limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/report:
    get:
      operationId: getMediaReport
      tags:
        - Media Jobs
      summary: Read the immutable successful media probe report
      description: >-
        Returns a report only after the current project job succeeded with independently verified
        input SHA-256 and a full video-stream decode. Failed or unfinished jobs have no MediaReport.
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Immutable media facts accepted from an approved Worker.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaReportResponse"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project-scoped job or its successful report was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/lease:
    post:
      operationId: acquireMediaJobLease
      tags:
        - Media Jobs
      summary: Exchange the current attempt capability for a short-lived input grant
      description: >-
        Internal Worker endpoint. Verifies the independent Worker service identity and the
        SHA-256-backed attempt lease token, moves the job and asset to RUNNING/INGESTING atomically,
        and returns a short-lived read-only URL. The URL is never persisted or logged by the platform.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaLeaseRequest"
      responses:
        "200":
          description: The current attempt owns an active lease and received a read grant.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLeaseResponse"
        "400":
          description: The path, header or request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or clip asset was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt or lease is stale, invalid, active elsewhere or terminal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not issue the read grant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/heartbeat:
    post:
      operationId: renewMediaJobLease
      tags:
        - Media Jobs
      summary: Renew the current Worker's active attempt lease
      description: >-
        Internal Worker endpoint. The service identity, opaque lease capability, current attempt,
        worker ID and unexpired lease must all match. A successful heartbeat sets lease_until to
        the current server time plus the configured lease duration; it never revives an expired or
        lost attempt and never accumulates lease time from the previous deadline.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaLeaseRequest"
      responses:
        "200":
          description: The current Worker's active lease was renewed.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaHeartbeatResponse"
        "400":
          description: The path, header or request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or attempt was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt, Worker ownership or lease is stale, expired or terminal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/result:
    put:
      operationId: acceptMediaProbeResult
      tags:
        - Media Jobs
      summary: Idempotently accept the current media probe attempt result
      description: >-
        Internal Worker endpoint. Validates the service identity, lease, job/attempt/message IDs,
        input/recipe/software digests, timestamps and the frozen media-probe-result.v1 contract.
        A successful result creates one immutable MediaReport and marks the asset INGESTED. A
        retryable failed result stores stable attempt diagnostics, keeps the asset INGESTING and
        schedules a new attempt with bounded backoff; a non-retryable or exhausted failure marks
        the asset INGEST_FAILED. Failed attempts never create a report. Inbox deduplication absorbs
        an exact replay.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../events/media-probe-result-v1.schema.json"
      responses:
        "200":
          description: Result accepted, or the exact previously accepted result replayed.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResultAcceptedResponse"
        "400":
          description: The result violates the frozen request contract.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The Worker software digest is not approved.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or clip asset was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt/result is stale, mismatched, expired or reuses a message ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/ai-jobs/{ai_job_id}/attempts/{attempt}/lease:
    post:
      operationId: acquireAiHandPoseJobLease
      tags: [AI Candidates]
      summary: Acquire frozen input for one AI hand pose attempt
      security: [{ aiWorkerBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AiJobId"
        - $ref: "#/components/parameters/AiJobAttempt"
        - $ref: "#/components/parameters/AiLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkerLeaseRequest"
      responses:
        "200":
          description: The current attempt owns the lease and received a read-only input grant.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiWorkerLeaseResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Object storage could not issue the input read grant.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/ai-jobs/{ai_job_id}/attempts/{attempt}/heartbeat:
    post:
      operationId: renewAiHandPoseJobLease
      tags: [AI Candidates]
      summary: Renew the current AI Worker's active attempt lease
      security: [{ aiWorkerBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AiJobId"
        - $ref: "#/components/parameters/AiJobAttempt"
        - $ref: "#/components/parameters/AiLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiWorkerLeaseRequest" }
      responses:
        "200":
          description: The active lease was renewed.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiWorkerHeartbeatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /internal/ai-jobs/{ai_job_id}/attempts/{attempt}/result:
    put:
      operationId: acceptAiHandPoseResult
      tags: [AI Candidates]
      summary: Idempotently accept one MediaPipe hand pose candidate result
      description: >-
        Internal AI Worker endpoint. Validates the service identity, opaque lease, frozen media and
        model SHA-256 values, timing window and result-message identity. Accepted detections are
        persisted only as CandidateAnnotation records; they never create formal annotations.
      security: [{ aiWorkerBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AiJobId"
        - $ref: "#/components/parameters/AiJobAttempt"
        - $ref: "#/components/parameters/AiLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../events/ai-hand-pose-result-v2.schema.json" }
      responses:
        "204":
          description: Result accepted, or its exact previous receipt replayed.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: actor_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$
    ClipAssetId:
      name: clip_asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-generated correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped to the current project and write operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional caller-generated idempotency key. The server creates a one-shot key when omitted.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    MediaJobId:
      name: media_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaJobAttempt:
      name: attempt
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MediaLeaseToken:
      name: X-Media-Lease-Token
      in: header
      required: true
      description: Opaque capability from the current restricted broker envelope; never log it.
      schema:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    AiJobId:
      name: ai_job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AiJobAttempt:
      name: attempt
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AiLeaseToken:
      name: X-AI-Lease-Token
      in: header
      required: true
      description: Opaque capability from the restricted AI broker envelope; never log it.
      schema: { type: string, minLength: 43, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Edge or service bearer token. Local development uses a synthetic bearer adapter and must
        never reuse hospital or production credentials.
    sessionCookie:
      type: apiKey
      in: cookie
      name: MVPSESSION
      description: HttpOnly session cookie for an internal platform-account browser session.
    workerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Independent Media Worker service identity accepted only by internal media job endpoints.
        Outside local/test it is a signed JWT with HTTPS issuer/JWK Set, a non-empty subject,
        bounded validity and exactly the configured Media Worker audience. Local/test retains a
        distinct synthetic static bearer for isolated development only.
    aiWorkerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Independent AI Worker service identity accepted only by internal AI candidate job endpoints.
        Outside local/test it is a signed JWT with its own exact audience; local/test retains a
        distinct synthetic static bearer only.
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The caller is not authorized for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested resource is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
  headers:
    NoStore:
      description: Prevents clients and intermediaries from retaining authorization-sensitive data.
      schema:
        type: string
        const: no-store
  schemas:
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    ProjectRenameRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
    PlatformSession:
      type: object
      additionalProperties: false
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/PlatformAccountRole"
    PlatformAccountRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    PlatformAccountCreateRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
    PlatformAccountEnabledRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    PlatformAccount:
      type: object
      additionalProperties: false
      required:
        - username
        - role
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
        role:
          $ref: "#/components/schemas/PlatformAccountRole"
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformAccountList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAccount"
    ProjectRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    ProjectStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    MembershipStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
    Project:
      type: object
      additionalProperties: false
      required:
        - project_id
        - display_name
        - status
        - current_role
        - created_at
      properties:
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: "#/components/schemas/ProjectStatus"
        current_role:
          $ref: "#/components/schemas/ProjectRole"
        created_at:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - items

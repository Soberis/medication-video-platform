        - safe_message
        - retryable
      properties:
        error_class:
          type: string
          enum:
            - RETRYABLE_TRANSIENT
            - RETRYABLE_RESOURCE
            - NON_RETRYABLE_INPUT
            - INTERNAL_BUG
        error_code:
          type: string
          enum:
            - OBJECT_STORAGE_UNAVAILABLE
            - MEDIA_PROBE_TIMEOUT
            - MEDIA_INPUT_DIGEST_MISMATCH
            - MEDIA_CONTAINER_UNSUPPORTED
            - MEDIA_VIDEO_STREAM_MISSING
            - MEDIA_DECODE_FAILED
            - MEDIA_TIMELINE_INVALID
            - MEDIA_PROBE_INTERNAL
            - WORKER_LEASE_LOST
        safe_message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
    MediaLeaseRequest:

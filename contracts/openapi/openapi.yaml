            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current persisted multipart progress.
          headers:
            Cache-Control:
              description: Prevents a resume client from using stale progress.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartProgressList"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: PLATFORM_LOCAL batches require an ACTIVE project ADMIN membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The file has not entered multipart upload.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/reconciliation:
    put:
      operationId: reconcileUploadParts
      tags:
        - Uploads
      summary: Reconcile persisted progress with object storage
      description: >-
        Requires an ACTIVE batch operator; PLATFORM_LOCAL batches require an ACTIVE project ADMIN.
        Idempotently lists the multipart upload in object storage and confirms every tracked part
        whose stored byte length matches the immutable manifest. This explicit command recovers
        parts uploaded before a client interruption without giving a state-changing side effect to
        the GET progress endpoint. Unknown, missing previously confirmed or size-mismatched parts
        produce a conflict instead of being silently accepted.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Storage and persisted progress are reconciled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartProgressList"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: PLATFORM_LOCAL batches require an ACTIVE project ADMIN membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Platform progress and object-storage state diverged.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not list the parts; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/camera-channels/{provisioning_key}:
    put:
      operationId: provisionCameraChannel
      tags:
        - Camera Configuration
      summary: Provision a stable logical camera channel
      description: >-
        Requires an ACTIVE ADMIN membership. This administrative or deployment-time operation maps
        a project-scoped, non-secret
        provisioning key to an immutable platform CameraChannel ID. Repeating the same natural-key
        PUT returns the original resource. The provisioning key is a technical integration key,
        not a user-facing alias or hardware credential. This operation does not contact or control
        an RK3588 device or camera.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: provisioning_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      responses:
        "201":
          description: Channel provisioned, or the existing resource returned idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of project configuration responses.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraChannel"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is an ACTIVE project MEMBER but not an ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist in the caller's ACTIVE membership scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/camera-sets/{camera_set_key}/versions/{configuration_version}:
    put:
      operationId: configureCameraSetVersion
      tags:
        - Camera Configuration
      summary: Create an immutable CameraSet configuration version
      description: >-
        Requires an ACTIVE ADMIN membership. This administrative or deployment-time operation
        creates an immutable, project-scoped
        CameraSet version from previously provisioned logical channels. Member order in the request
        is insignificant; camera_index defines canonical order. Repeating the same natural-key PUT
        with equivalent content returns the original resource, while changed content for an existing
        version is rejected. At least one member must be enabled, and channel IDs and indices must be
        unique. The resulting camera_set_id is provisioned to the RK3588 integration for later
        CaptureSession ingest; this operation does not test camera connectivity or trigger capture.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: camera_set_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        - name: configuration_version
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraSetRequest"
      responses:
        "201":
          description: CameraSet version created, or the equivalent existing version returned idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of project configuration responses.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSet"
        "400":
          description: Path or request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is an ACTIVE project MEMBER but not an ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist in the caller's ACTIVE membership scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            A referenced channel is outside the project, a member invariant failed, or the immutable
            version already exists with different content.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/external-video-ingest-manifests:
    post:
      operationId: acceptExternalVideoIngestManifestV1
      tags:
        - External Ingest
      summary: Validate an explicit external video ingest manifest
      description: >-
        Validates the versioned external manifest and its explicit capture-group/camera-number
        identity. expected_camera_numbers is the theoretical fixed-camera set; videos is the
        actual declared set for this Capture. The platform never derives a group or camera identity
        from filenames, upload order or timestamps; file bytes continue through the existing upload flow.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/external-video-ingest-v1.schema.json" }
      responses:
        "202":
          description: Manifest metadata passed validation.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalVideoIngestManifestAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/external-video-ingest-manifests/v2:
    post:
      operationId: acceptExternalVideoIngestManifestV2
      tags:
        - External Ingest
      summary: Accept an incremental external video ingest manifest with explicit group finalization
      description: >-
        Validates the versioned external CaptureGroup manifest and its explicit camera identities.
        The videos array may add late camera declarations only while the manifest remains ACCEPTED and
        unbound. Once the manifest is BOUND, its declaration rows are immutable; a declared row is upload
        intent, not proof that bytes were received. The receipt remains RECEIVING until the explicit
        receipt-finalize command (or the same-manifest close request after CaptureSession assembly), then
        COMPLETE or INCOMPLETE is calculated from actual bound ClipAsset/CameraStream facts. Timeout,
        Media Probe, MediaPipe and quality facts never finalize or rewrite the receipt.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/external-video-ingest-v2.schema.json" }
      responses:
        "202":
          description: Manifest metadata accepted or replayed idempotently.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalVideoIngestManifestV2Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/capture-groups:
    get:
      operationId: listCaptureGroups
      tags:
        - Asset Catalog
      summary: List lightweight CaptureGroup summaries
      description: >-
        Returns a bounded page of CaptureGroup summaries owned by the project in newest-first order.
        The list is sourced from server-side CaptureSession facts, so receiving groups and groups
        without an AnnotationTask remain visible. Each item contains only group identity, capture and
        device time, receipt state, camera counts and missing camera numbers; the full camera-set
        snapshot and stream list remain available from the detail endpoint. Receipt facts are
        independent of media probing and quality state.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding CaptureGroup page.
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: CaptureGroup list.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroupListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{project_id}/capture-groups/{capture_group_id}:
    get:
      operationId: getCaptureGroup
      tags:
        - Asset Catalog
      summary: Read one CaptureGroup and its receipt/view facts
      description: >-
        Returns the V1.28 CaptureGroup read model. capture_group_id is the same stable identifier as
        capture_session_id. Expected, received and missing camera numbers come from the frozen
        CameraSetSnapshot and bound CameraStreams; camera gaps are preserved. Receipt is independent
        of media probing and quality state, and the response does not expose storage locations.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: CaptureGroup read model.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/capture-group-quality-reviews:
    get:
      operationId: listCaptureGroupQualityReviews
      tags:
        - Quality Review
      summary: Read current human quality conclusions for a CaptureGroup page
      description: >-
        Returns the current append-only group-quality fact for each requested CaptureGroup in one
        bounded read. An undeclared conclusion is returned as UNREVIEWED. The endpoint is a read-only
        page projection and does not infer quality from receipt, media or task state.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: query
          required: true
          description: CaptureGroup identifiers on the current project page; repeated query parameter.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Current group-quality facts in the same order as the distinct requested identifiers.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroupQualityReviewBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{project_id}/capture-groups/{capture_group_id}/receipt/finalize:
    post:
      operationId: finalizeCaptureGroupReceipt
      tags:
        - Asset Catalog
      summary: Explicitly finalize a CaptureGroup receipt from actual bound views
      description: >-
        Closes the upload set only after the upload-backed CaptureSession exists. The server computes
        received_camera_numbers from bound CameraStreams/ClipAssets and persists COMPLETE or INCOMPLETE
        on the CaptureSession. Repeating the command returns the same final receipt; it never reopens or
        changes a finalized receipt. Timeout, Media Probe, MediaPipe and quality facts are not used.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Finalized CaptureGroup read model.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/capture-groups/{capture_group_id}/quality-review:
    get:
      operationId: getCaptureGroupQualityReview
      tags:
        - Quality Review
      summary: Read the current human quality conclusion for a CaptureGroup
      description: >-
        Returns the append-only group-quality fact for the explicit CaptureGroup. An undeclared
        conclusion is returned as UNREVIEWED. The response includes the confirmed participating
        View Set and input-version identity used by the conclusion; later view changes do not
        rewrite that historical fact.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current group-quality fact or the explicit UNREVIEWED projection.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroupQualityReview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: recordCaptureGroupQualityReview
      tags:
        - Quality Review
      summary: Record or revise the human quality conclusion for a CaptureGroup
      description: >-
        Requires an ACTIVE project member and writes one immutable group-quality fact. RECEIVING
        groups cannot be finalized as QUALIFIED or QUALIFIED_WITH_EXCLUSIONS; only COMPLETE or
        INCOMPLETE receipts may be admitted to annotation. A qualifying decision requires at least
        one current human-qualified participating view. Repeating an Idempotency-Key is safe, while
        a changed conclusion increments the append-only revision.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OptionalRequestId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureGroupQualityReviewRequest" }
      responses:
        "200":
          description: The immutable group-quality fact recorded or replayed by the command.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroupQualityReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/capture-groups/{capture_group_id}/quality-review/history:
    get:
      operationId: listCaptureGroupQualityReviewHistory
      tags:
        - Quality Review
      summary: Read append-only CaptureGroup quality history
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Group-quality facts ordered by revision ascending.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureGroupQualityReviewHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/capture-groups/{capture_group_id}/annotation-tasks:
    post:
      operationId: assignCaptureGroupHumanLabelTask
      tags:
        - Annotation
      summary: Explicitly assign an optional human-label task for a CaptureGroup
      description: >-
        Requires an ACTIVE project administrator and an ACTIVE project member as the assignee.
        The CaptureGroup must have a current admitting human-quality conclusion. This command is
        the explicit opt-in boundary for the human-label path; qualifying a CaptureGroup alone does
        not create a task. Repeating the Idempotency-Key replays the same assignment. Reassigning an
        existing task to a different member is rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationTaskAssignmentRequest" }
      responses:
        "201":
          description: The explicitly assigned task, or the identical idempotent replay.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/annotation-tasks/{annotation_task_id}/primary-view:
    put:
      operationId: selectCaptureGroupAnnotationPrimaryView
      tags:
        - Annotation
      summary: Select the CaptureGroup annotation timebase view
      description: >-
        Selects an eligible participating view as the formal annotation timebase. The view does
        not own the annotation. The selection is allowed before the first formal revision and is
        frozen once that revision exists; a group-quality downgrade blocks annotation submission
        but does not delete, replace or reassign the existing task.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationPrimaryViewRequest" }
      responses:
        "200":
          description: CaptureGroup-owned annotation task with the selected timebase view.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/clip-assets/{clip_asset_id}:
    get:
      operationId: getClipAsset
      tags:
        - Asset Catalog
      summary: Get one video asset and its optional session binding
      description: >-
        Returns only persisted catalog metadata in the requested authorized project. This endpoint does not
        authorize raw/deidentified preview, return a download URL or expose object-storage location.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: clip_asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ClipAsset detail.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetRead"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested project or ClipAsset not found in the actor's visible scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteClipAsset
      tags:
        - Asset Catalog
      summary: Soft-delete one selected video asset
      description: >-
        Requires ACTIVE ADMIN membership in the explicit project. The command never deletes the
        underlying object synchronously and never deletes sibling streams or historical evidence.
        It hides the asset from ordinary catalog reads and marks its bound stream unavailable; a
        repeated deletion is a no-op and does not add another audit event.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: clip_asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipAssetDeletionRequest"
      responses:
        "204":
          description: The video is deleted or was already deleted by an earlier request.
        "400":
          description: The deletion reason or headers are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or active video asset is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/clip-assets/{clip_asset_id}/activity:
    get:
      operationId: getClipAssetActivity
      tags:
        - Asset Catalog
      summary: List append-only auditable operations associated with one active video asset
      description: >-
        Returns a bounded keyset page of audit events whose direct object is the ClipAsset or whose
        minimized audit details explicitly bind the event to this clip_asset_id. This read requires
        ACTIVE project membership, never returns details_json, trace IDs, authorization references,
        object-storage locations or media URLs, and does not claim to be a history of every internal
        technical state transition.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: clip_asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding activity page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Project-scoped page of append-only auditable operations.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetActivity"
        "400":
          description: Invalid limit or cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":

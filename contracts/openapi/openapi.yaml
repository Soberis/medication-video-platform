    ApiError:
      type: object
      additionalProperties: false
      required:
        - error_code
        - error_message
        - retryable
        - request_id
      properties:
        error_code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
        error_message:
          type: string
          minLength: 1
          description: Safe human-readable error message without internal stack details.
        retryable:
          type: boolean
          description: Whether retrying the same operation may succeed without changing the request.
        request_id:
          type: string
          minLength: 1
          description: Request correlation identifier.
        trace_id:
          type:
            - string
            - "null"
          description: Optional distributed trace identifier.
    MediaJobType:
      type: string
      additionalProperties: false
      description: >-
        Allowlist of media job types. Unknown values are rejected at the API boundary.
      enum:
        - MEDIA_PROBE
    MediaJobStatus:
      type: string
      additionalProperties: false
      description: >-
        Lifecycle state of a media job. Creation normally returns QUEUED after the job, first
        attempt and Outbox event commit atomically. RETRY_WAIT means a retryable attempt result was
        accepted and the next attempt is delayed by Outbox available_at. RUNNING and terminal
        states require a lease-matched Worker interaction.
      enum:
        - REQUESTED
        - QUEUED
        - RUNNING
        - RETRY_WAIT
        - SUCCEEDED
        - FAILED
        - CANCEL_REQUESTED
        - CANCELLED
    MediaJobAttemptStatus:
      type: string
      additionalProperties: false
      description: >-
        Lifecycle state of one execution attempt. LOST records a previously running attempt whose
        lease expired beyond the grace period; it does not mean the business job is terminal.
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - LOST
        - CANCELLED
    MediaJobRequest:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - job_type
      properties:
        clip_asset_id:
          type: string
          format: uuid
          description: Identifier of a previously completed and verified uploaded clip asset.
        job_type:
          $ref: "#/components/schemas/MediaJobType"
    MediaJobReplayRequest:
      type: object
      additionalProperties: false
      required:
        - dead_letter_id
        - source_message_id
        - source_attempt
        - dead_letter_reason
        - body_sha256
        - operator_reason_code
        - change_reference
      properties:
        dead_letter_id:
          type: string
          format: uuid
          description: Deterministic UUIDv5 from the sanitized diagnostic reason and body digest.
        source_message_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        dead_letter_reason:
          type: string
          enum:
            - MEDIA_JOB_ACQUIRE_REJECTED
            - MEDIA_JOB_LEASE_REJECTED
            - MEDIA_JOB_RESULT_REJECTED
          description: >-
            Stable reason from media-dead-letter.v1. MEDIA_JOB_CONTRACT_INVALID is intentionally
            excluded because it has no trusted job identity.
        body_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 from the sanitized diagnostic, never the original message body.
        operator_reason_code:
          type: string
          enum:
            - CONFIGURATION_FIXED
            - WORKER_DEPLOYMENT_FIXED
            - AUTHORIZATION_FIXED
            - OTHER_APPROVED
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]+$
          description: Non-sensitive ticket, deployment or commit reference supporting the replay.
    MediaJobReplayResponse:
      type: object
      additionalProperties: false
      required:
        - replay_id
        - media_job_id
        - dead_letter_id
        - source_attempt
        - new_attempt
        - resulting_job_status
        - created_at
      properties:
        replay_id:
          type: string
          format: uuid
        media_job_id:
          type: string
          format: uuid
        dead_letter_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        new_attempt:
          type: integer
          minimum: 2
        resulting_job_status:
          type: string
          const: QUEUED
          description: State committed by the original replay command, not a live job-status read.
        created_at:
          type: string
          format: date-time
    MediaJobDeliveryRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - source_message_id
        - source_attempt
        - recovery_reason
        - change_reference
      properties:
        source_message_id:
          type: string
          format: uuid
          description: Message ID of the current QUEUED attempt confirmed absent from RabbitMQ.
        source_attempt:
          type: integer
          minimum: 1
        recovery_reason:
          type: string
          const: BROKER_MESSAGE_LOST
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]+$
          description: Non-sensitive incident, ticket or deployment reference.
    MediaJobCurrentDeliveryRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - change_reference
      properties:
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]+$
          description: Non-sensitive incident, ticket or deployment reference.
    MediaJobDeliveryRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - recovery_id
        - media_job_id
        - source_message_id
        - source_attempt
        - new_attempt
        - resulting_job_status
        - created_at
      properties:
        recovery_id:
          type: string
          format: uuid
        media_job_id:
          type: string
          format: uuid
        source_message_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        new_attempt:
          type: integer
          minimum: 2
        resulting_job_status:
          type: string
          const: QUEUED
        created_at:
          type: string
          format: date-time
    AiEvaluationCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        At least one of sample_version or sample_sha256 must bind the record to an authorized
        sample. The seven metric keys are fixed by V1.18 and must each occur exactly once.
      required:
        - model_sha256
        - profile_sha256
        - parameter_adjustment_note
        - metrics
      properties:
        sample_version:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
            - type: "null"
        sample_sha256:
          anyOf:
            - type: string
              pattern: "^[a-f0-9]{64}$"
            - type: "null"
        model_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        profile_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        parameter_adjustment_note:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "^[^\\x00-\\x1F\\x7F]*$"
        metrics:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/AiEvaluationMetricRequest" }
    AiEvaluationMetricRequest:
      type: object
      additionalProperties: false
      required: [metric_key, status]
      properties:
        metric_key:
          type: string
          enum:
            - HAND_FRAME_RECALL
            - NO_HAND_FRAME_FALSE_POSITIVE_RATE
            - LANDMARK_21_VALID_RATE
            - HANDEDNESS_ACCURACY
            - FAST_MOTION_OCCLUSION_USEFULNESS
            - OVERLAY_TIME_ERROR
            - PROCESSING_TIME_PER_MINUTE
        status:
          type: string
          enum: [PENDING, RECORDED]
        value:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
          description: Must be null for PENDING; RECORDED requires finite non-negative evidence.
    AiEvaluationResponse:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - project_id
        - sample_version
        - sample_sha256
        - model_sha256
        - profile_sha256
        - status
        - parameter_adjustment_note
        - metrics
        - created_by
        - created_at
        - schema_version
      properties:
        evaluation_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        sample_version:
          anyOf:
            - type: string
            - type: "null"
        sample_sha256:
          anyOf:
            - type: string
              pattern: "^[a-f0-9]{64}$"
            - type: "null"
        model_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        profile_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [PENDING, RECORDED] }
        parameter_adjustment_note: { type: string, minLength: 1, maxLength: 2000 }
        metrics:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/AiEvaluationMetric" }
        created_by: { type: string, minLength: 1, maxLength: 128 }
        created_at: { type: string, format: date-time }
        schema_version: { type: string, const: ai-evaluation.v1 }
    AiEvaluationMetric:
      type: object
      additionalProperties: false
      required: [metric_key, status, value]
      properties:
        metric_key:
          type: string
          enum:
            - HAND_FRAME_RECALL
            - NO_HAND_FRAME_FALSE_POSITIVE_RATE
            - LANDMARK_21_VALID_RATE
            - HANDEDNESS_ACCURACY
            - FAST_MOTION_OCCLUSION_USEFULNESS
            - OVERLAY_TIME_ERROR
            - PROCESSING_TIME_PER_MINUTE
        status: { type: string, enum: [PENDING, RECORDED] }
        value:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
    HandPoseJobResponse:
      type: object
      additionalProperties: false
      required:
        - ai_job_id
        - project_id
        - clip_asset_id
        - algorithm_key
        - algorithm_version
        - model_sha256
        - input_sha256
        - input_size_bytes
        - sampling_fps
        - profile_sha256
        - status
        - hand_result
        - requested_by
        - created_at
        - updated_at
      properties:
        ai_job_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        clip_asset_id:
          type: string
          format: uuid
        algorithm_key:
          type: string
          const: MEDIAPIPE_HAND_LANDMARKER
        algorithm_version:
          type: string
          const: v1
        model_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        input_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        input_size_bytes:
          type: integer
          format: int64
          minimum: 1
        sampling_fps:
          type: integer
          minimum: 1
          maximum: 15
          const: 10
        profile_sha256:
          type: string
          const: 3a3be8035ec8a9756a32f43b007a4bb2cc2e2c0468d744d248f19c692fd90626
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
        hand_result:
          type: string
          enum: [UNKNOWN, HAND_DETECTED, NO_HAND_DETECTED]
        run_summary:
          anyOf:
            - $ref: "#/components/schemas/HandPoseRunSummary"
            - type: "null"
        requested_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HandPoseCandidateResponse:
      type: object
      additionalProperties: false
      required: [job, candidates]
      properties:
        job: { $ref: "#/components/schemas/HandPoseJobResponse" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/HandPoseCandidate" }
    HandPoseRunSummary:
      type: object
      additionalProperties: false
      required:
        - analysis_complete
        - hand_result
        - total_video_frames
        - inference_frame_count
        - frames_with_hand
        - frames_without_hand
        - left_hand_detection_count
        - right_hand_detection_count
        - invalid_landmark_count
        - processing_duration_ms
        - started_at
        - completed_at
        - retryable
      properties:
        analysis_complete: { type: boolean }
        hand_result:
          type: string
          enum: [UNKNOWN, HAND_DETECTED, NO_HAND_DETECTED]
        total_video_frames: { type: integer, format: int64, minimum: 0 }
        inference_frame_count: { type: integer, format: int64, minimum: 0 }
        frames_with_hand: { type: integer, format: int64, minimum: 0 }
        frames_without_hand: { type: integer, format: int64, minimum: 0 }
        left_hand_detection_count: { type: integer, format: int64, minimum: 0 }
        right_hand_detection_count: { type: integer, format: int64, minimum: 0 }
        invalid_landmark_count: { type: integer, format: int64, minimum: 0 }
        processing_duration_ms: { type: integer, format: int64, minimum: 0 }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        failure_reason:
          anyOf:
            - type: string
              maxLength: 128
            - type: "null"
        retryable: { type: boolean }
    HandPoseCandidate:
      type: object
      additionalProperties: false
      required: [frame_timestamp_ms, image_width, image_height, hand_index, handedness, handedness_score, bounding_box, landmarks, valid_landmark_count]
      properties:
        frame_timestamp_ms: { type: integer, format: int64, minimum: 0 }
        image_width: { type: integer, minimum: 1 }
        image_height: { type: integer, minimum: 1 }
        hand_index: { type: integer, minimum: 0, maximum: 1 }
        handedness: { type: string, enum: [LEFT, RIGHT, UNKNOWN] }
        handedness_score: { type: number, minimum: 0, maximum: 1 }
        bounding_box:
          type: object
          additionalProperties: false
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number, exclusiveMinimum: 0 }
            height: { type: number, exclusiveMinimum: 0 }
        landmarks:
          type: array
          minItems: 21
          maxItems: 21
          items:
            type: object
            additionalProperties: false
            required: [x, y, z]
            properties:
              x: { type: number }
              y: { type: number }
              z: { type: number }
        valid_landmark_count: { type: integer, minimum: 21, maximum: 21 }
    MediaJobResponse:
      type: object
      additionalProperties: false
      required:
        - media_job_id
        - project_id
        - clip_asset_id
        - job_type
        - status
        - input_digest
        - input_size_bytes
        - content_type
        - probe_profile_key
        - recipe_digest
        - current_attempt
        - created_at
        - updated_at
      properties:
        media_job_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        clip_asset_id:
          type: string
          format: uuid
        job_type:
          $ref: "#/components/schemas/MediaJobType"
        status:
          $ref: "#/components/schemas/MediaJobStatus"
        input_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 of the input bytes as verified at upload completion.
        input_size_bytes:
          type: integer
          format: int64
          minimum: 1
        content_type:
          type: string
        probe_profile_key:
          type: string
          const: media-probe-baseline-v1
          description: Server-approved immutable probe profile selected for this job.
        recipe_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 identity of the exact approved probe recipe.
        current_attempt:
          $ref: "#/components/schemas/MediaJobAttemptResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MediaJobAttemptResponse:
      type: object
      additionalProperties: false
      required:
        - attempt
        - status
        - lease_until
        - last_heartbeat_at
        - started_at
        - completed_at
        - error
      properties:
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/MediaJobAttemptStatus"
        lease_until:
          type:
            - string
            - "null"
          format: date-time
        last_heartbeat_at:
          type:
            - string
            - "null"
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/MediaJobErrorResponse"
            - type: "null"
    MediaJobErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error_class
        - error_code
        - safe_message
        - retryable
      properties:
        error_class:
          type: string
          enum:
            - RETRYABLE_TRANSIENT
            - RETRYABLE_RESOURCE
            - NON_RETRYABLE_INPUT
            - INTERNAL_BUG
        error_code:
          type: string
          enum:
            - OBJECT_STORAGE_UNAVAILABLE
            - MEDIA_PROBE_TIMEOUT
            - MEDIA_INPUT_DIGEST_MISMATCH
            - MEDIA_CONTAINER_UNSUPPORTED
            - MEDIA_VIDEO_STREAM_MISSING
            - MEDIA_DECODE_FAILED
            - MEDIA_TIMELINE_INVALID
            - MEDIA_PROBE_INTERNAL
            - WORKER_LEASE_LOST
        safe_message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
    MediaLeaseRequest:
      type: object
      additionalProperties: false
      required:
        - worker_id
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    AiWorkerLeaseRequest:
      type: object
      additionalProperties: false
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$
    AiWorkerLeaseResponse:
      type: object
      additionalProperties: false
      required: [job_id, attempt, input_url, expires_at, lease_until, heartbeat_interval_seconds, input_sha256, input_size_bytes, content_type, model_sha256, sampling_fps, profile_sha256]
      properties:
        job_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        input_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        lease_until: { type: string, format: date-time }
        heartbeat_interval_seconds: { type: integer, format: int64, minimum: 1 }
        input_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        input_size_bytes: { type: integer, format: int64, minimum: 1 }
        content_type: { type: string }
        model_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        sampling_fps: { type: integer, const: 10 }
        profile_sha256: { type: string, const: 3a3be8035ec8a9756a32f43b007a4bb2cc2e2c0468d744d248f19c692fd90626 }
    AiWorkerHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [job_id, attempt, lease_until, heartbeat_interval_seconds]
      properties:
        job_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        lease_until: { type: string, format: date-time }
        heartbeat_interval_seconds: { type: integer, format: int64, minimum: 1 }
    MediaLeaseResponse:
      type: object
      additionalProperties: false
      required:
        - job_id
        - attempt
        - input_url
        - expires_at
        - lease_until
        - heartbeat_interval_seconds
        - input_sha256
        - input_size_bytes
        - content_type
      properties:
        job_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        input_url:
          type: string
          format: uri
          description: Ephemeral job-scoped read grant; must not be logged or persisted.
        expires_at:
          type: string
          format: date-time
        lease_until:
          type: string
          format: date-time
          description: Server-authoritative deadline for this attempt lease.
        heartbeat_interval_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Maximum normal interval between Worker heartbeats for this lease.
        input_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        input_size_bytes:
          type: integer
          format: int64
          minimum: 1
        content_type:
          type: string
    MediaHeartbeatResponse:
      type: object
      additionalProperties: false
      required:
        - job_id
        - attempt
        - lease_until
        - heartbeat_interval_seconds
      properties:
        job_id:
          type: string
          format: uuid
        attempt:

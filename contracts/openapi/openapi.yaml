    AnnotationRevisionSummary:
      type: object
      additionalProperties: false
      required:
        - annotation_revision_id
        - revision_number
        - label_schema_id
        - label_schema_digest
        - annotation_document
        - submitted_by
        - submitted_at
        - review
        - post_cleaning_result
      properties:
        annotation_revision_id:
          type: string
          format: uuid
        revision_number:
          type: integer
          minimum: 1
        label_schema_id:
          type: string
          format: uuid
        label_schema_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        annotation_document:
          type: object
          additionalProperties: false
          required:
            - schema_version
            - segments
          properties:
            schema_version:
              type: string
              const: annotation-document.v1
            segments:
              type: array
              minItems: 1

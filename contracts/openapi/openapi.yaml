  /dataset-exports/{dataset_export_id}/replays:
    post:
      operationId: replayDeadLetteredDatasetExport
      tags:
        - Dataset Admission
      summary: Create an audited new attempt from a retained dataset export dead-letter diagnostic
      description: >-
        Administrator-only recovery command. The caller copies only safe identity fields from the
        retained dataset-export-dead-letter.v1 diagnostic. The server verifies the deterministic
        UUIDv5 dead_letter_id, current project/export/message/attempt identity, replayable reason,
        output cleanup, replay limit and idempotency key; it then marks the old attempt failed and
        atomically creates a new attempt, lease capability, message ID, Outbox event, immutable replay
        record and append-only audit event. The DLQ body is never accepted or republished. A
        DATASET_EXPORT_JOB_CONTRACT_INVALID diagnostic is not replayable because it has no trusted
        export identity.
      parameters:
        - $ref: "#/components/parameters/DatasetExportId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetExportManualReplayRequest"
      responses:
        "202":
          description: New attempt queued, or the exact command replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExportManualReplayResponse"
        "400":
          description: The diagnostic fields, change reference or idempotency key are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The dataset export is not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The diagnostic is not replayable or does not match the current attempt, cleanup failed,
            the replay limit or export state was reached, or the idempotency key/dead-letter identity
            conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"

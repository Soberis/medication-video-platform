  /upload/{batch_id}/completion:
    put:
      operationId: completeUploadBatch
      tags:
        - Uploads
      summary: Complete a verified upload batch and bind raw video assets
      description: >-
        Called automatically by the edge uploader after every declared file has completed final
        object size and full-file SHA-256 verification. The command locks the batch, checks exact
        file count and total bytes, verifies the upload-file-manifest-v1 digest, and creates one
        immutable minimal RAW ClipAsset binding for each VIDEO file and one immutable CaptureEventLog
        object index for each EVENT_LOG file. METADATA remains an uploaded source object for session
        ingestion. EVENT_LOG payloads are not interpreted and do not become ClipAssets.
        The natural-resource PUT is idempotent: a replay returns the persisted completion and never
        creates duplicate assets. It does not perform media probing or create a CaptureSession.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch completed and raw video files bound to minimal ClipAssets, or replayed idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of mutable operational state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatchCompletion"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":

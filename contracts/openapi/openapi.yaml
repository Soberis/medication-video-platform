            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetRead"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":

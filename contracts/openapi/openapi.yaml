  /projects/{project_id}/clip-assets:
    get:
      operationId: listClipAssets
      tags:
        - Asset Catalog
      summary: List single-camera video assets in one authorized project
      description: >-
        Returns a bounded keyset page ordered by record_start_utc when bound, otherwise asset
        created_at, then clip_asset_id descending. session_binding is null for a verified asset that
        has not yet been assembled into a CaptureSession. Storage addresses, credentials and preview
        URLs are intentionally excluded. folder_id selects one real project folder; unclassified=true
        selects the null-folder query projection. They cannot be combined.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_session_id
          in: query
          schema:
            type: string
            format: uuid
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: device_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        - name: camera_role
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Z][A-Z0-9_]{0,63}$
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ClipAssetStatus"
        - name: folder_id
          in: query
          description: Return only assets classified in this project folder.
          schema:
            type: string
            format: uuid
        - name: unclassified
          in: query
          description: Return only assets whose folder_id is null. Cannot be true with folder_id.
          schema:
            type: boolean
            default: false
        - name: recorded_from
          in: query
          description: Inclusive lower bound on record_start_utc or unbound asset created_at.
          schema:
            type: string
            format: date-time
        - name: recorded_before
          in: query
          description: Exclusive upper bound on record_start_utc or unbound asset created_at.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding ClipAsset page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Project-scoped page of ClipAssets.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipAssetList"
        "400":
          description: Invalid filter, time range, limit or cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The requested project does not exist, is inactive or is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/clip-assets/{clip_asset_id}:

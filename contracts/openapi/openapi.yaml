        - name: source
          in: query
          schema: { $ref: "#/components/schemas/UploadSourceType" }
        - name: media_status
          in: query
          schema: { $ref: "#/components/schemas/ClipAssetStatus" }
        - name: hand_status
          in: query
          schema:
            type: string
            enum: [NOT_REQUESTED, QUEUED, RUNNING, SUCCEEDED, FAILED]
        - name: hand_result
          in: query
          schema:
            type: string
            enum: [UNKNOWN, HAND_DETECTED, NO_HAND_DETECTED]
        - name: annotation_status
          in: query
          schema:
            type: string
            enum: [NOT_STARTED, ASSIGNED, SUBMITTED, COMPLETED]
        - name: cleaning_status
          in: query
          schema:
            type: string
            enum: [NOT_STARTED, PASS, WARNING, REJECT]
        - name: camera_number
          in: query
          schema: { type: integer, minimum: 1, maximum: 64 }
        - name: captured_from
          in: query
          schema: { type: string, format: date-time }
        - name: captured_before
          in: query
          schema: { type: string, format: date-time }
        - name: received_from
          in: query
          schema: { type: string, format: date-time }
        - name: received_before
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Project-scoped video summary page.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/video-data/summary:
    get:
      operationId: getVideoDataSummary
      tags:
        - Video Management
      summary: Get aggregate video-management counters for one project
      description: >-
        Returns duration in microseconds and storage in bytes. Counts are computed from the same

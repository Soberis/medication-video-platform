        input fingerprint returns the existing immutable result; a changed input creates a new run and
        result without overwriting history. A non-qualified current quality fact is recorded as REJECT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "200":
          description: Current-facts post-cleaning result, including a safe idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCleaningResult"
        "400":
          description: The identifiers are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No authenticated platform session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:

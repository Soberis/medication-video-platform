                $ref: "#/components/schemas/ApiError"
        "401":
          description: No authenticated platform session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A global administrator with ACTIVE project ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or revision is not visible to the caller.
          content:
            application/problem+json:

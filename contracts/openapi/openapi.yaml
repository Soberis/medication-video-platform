  /projects/{project_id}/annotation-tasks/{annotation_task_id}/revisions:
    post:
      operationId: submitAnnotationRevision
      tags:
        - Annotation Tasks
      summary: Submit an immutable manual annotation revision for an assigned task
      description: >-
        Requires an ACTIVE project membership and that the caller is the task assignee. The task's
        video must still be undeleted, INGESTED and human-qualified. P0 accepts a small
        annotation-document.v1 consisting of one or more primary-Step time ranges selected from the
        immutable schema bound to the task and an optional note. Primary-Step ranges may touch at a
        boundary but must not overlap. This operation does not provide drawing tools, AI annotations
        or independent review. When a media report exists, each range must also end within its
        verified duration.
        The Idempotency-Key safely replays the identical submission without creating another revision.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationRevisionRequest"
      responses:
        "201":
          description: Immutable revision for the current submission round, or the identical idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationRevision"

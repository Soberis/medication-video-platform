                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested project or session not found in the actor's visible scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/videos:
    get:
      operationId: listVideoSummaries

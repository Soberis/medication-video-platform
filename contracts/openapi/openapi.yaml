    DatasetVersionCurrentAdmission:
      type: object
      additionalProperties: false
      required:
        - dataset_version_id
        - all_members_currently_admission_eligible
        - members
        - build_readiness
        - can_start_build
      properties:
        dataset_version_id:
          type: string
          format: uuid
        all_members_currently_admission_eligible:
          type: boolean
          description: >-
            Current observation only. True does not freeze the draft, approve release, assign splits,
            or state that the DatasetVersion can be frozen.
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DatasetVersionCurrentAdmissionMember"
        build_readiness:
          $ref: "#/components/schemas/DatasetVersionBuildReadiness"
        can_start_build:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, the DatasetVersion
            is still DRAFT and this response's build readiness has no blocker. The start command
            rechecks every prerequisite in its own transaction.
    DatasetVersionBuildReadiness:
      type: object
      additionalProperties: false
      required:
        - ready_for_build
        - blocking_reasons
        - immutable_evidence_still_current
        - uniform_label_schema_digest
        - uniform_cleaning_rule_set_digest
        - dataset_split_plan_id
        - build_specification
      properties:
        ready_for_build:
          type: boolean
          description: >-
            True only when every current DRAFT-to-BUILDING prerequisite reported by this contract is
            satisfied. It does not mean the DatasetVersion is validated, frozen, approved or exportable.
        blocking_reasons:
          type: array
          maxItems: 9
          uniqueItems: true
          description: Stable, deterministic reasons that currently prevent DRAFT-to-BUILDING.
          items:
            type: string
            enum:
              - SELECTION_RULE_NOT_FIXED
              - LABEL_SCHEMA_NOT_FIXED
              - LABEL_SCHEMA_NOT_UNIFORM
              - CLEANING_RULE_SET_NOT_FIXED
              - CLEANING_RULE_SET_NOT_UNIFORM
              - SPLIT_PLAN_NOT_FIXED
              - EXPORT_PROFILE_NOT_FIXED
              - CURRENT_ADMISSION_NOT_ELIGIBLE
              - SNAPSHOT_EVIDENCE_CHANGED
        immutable_evidence_still_current:
          type: boolean
          description: True when no tracked current fact differs from the immutable candidate snapshot.
        uniform_label_schema_digest:
          type: [string, "null"]
          pattern: ^[a-f0-9]{64}$
          description: The common candidate digest when every snapshot stream uses one label schema; otherwise null.
        uniform_cleaning_rule_set_digest:
          type: [string, "null"]
          pattern: ^[a-f0-9]{64}$
          description: The common candidate digest when every snapshot stream uses one cleaning rule set; otherwise null.
        dataset_split_plan_id:
          type: [string, "null"]
          format: uuid
          description: The fixed immutable split plan, or null when the draft has none.
        build_specification:
          description: The fixed immutable minimum build configuration, or null when the draft has none.
          oneOf:
            - $ref: "#/components/schemas/DatasetBuildSpecification"
            - type: "null"
    DatasetVersionCurrentAdmissionMember:
      type: object
      additionalProperties: false
      required:
        - capture_session_id
        - candidate_index
        - current_admission
        - evidence_changes
      properties:
        capture_session_id:
          type: string
          format: uuid
          description: The immutable candidate member identity.
        candidate_index:
          type: integer
          minimum: 0
          description: The immutable candidate order retained by the DRAFT snapshot.
        current_admission:
          $ref: "#/components/schemas/DatasetAdmissionPreview"
        evidence_changes:
          type: array
          description: >-
            Differences between the immutable candidate evidence and current facts. An empty array
            means no tracked evidence difference was found; it does not authorize a freeze or release.
          items:
            $ref: "#/components/schemas/DatasetVersionEvidenceChange"
    DatasetVersionEvidenceChange:
      type: object
      additionalProperties: false
      required:
        - scope
        - camera_stream_id
        - change_codes
      properties:
        scope:
          type: string
          enum: [SESSION, STREAM]
        camera_stream_id:
          type: [string, "null"]
          format: uuid
          description: Null for a SESSION change; identifies the affected immutable stream for a STREAM change.
        change_codes:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Stable evidence-difference codes. SESSION codes are
            SESSION_EXPECTED_CAMERA_COUNT_CHANGED, SESSION_RECEIVED_CAMERA_COUNT_CHANGED,
            SESSION_ASSEMBLY_STATUS_CHANGED and SESSION_QUALITY_STATUS_CHANGED. STREAM codes are
            STREAM_ADDED, STREAM_REMOVED, STREAM_ASSET_SHA256_CHANGED,
            STREAM_QUALITY_REVIEW_DECISION_CHANGED, STREAM_QUALITY_REVIEW_VERSION_CHANGED,
            STREAM_ANNOTATION_REVISION_CHANGED, STREAM_ANNOTATION_DOCUMENT_SHA256_CHANGED,
            STREAM_LABEL_SCHEMA_DIGEST_CHANGED, STREAM_CLEANING_RESULT_CHANGED,
            STREAM_CLEANING_RUN_CHANGED, STREAM_CLEANING_RULE_SET_DIGEST_CHANGED and
            STREAM_POST_CLEANING_OUTCOME_CHANGED.
          items:
            type: string
            enum:
              - SESSION_EXPECTED_CAMERA_COUNT_CHANGED
              - SESSION_RECEIVED_CAMERA_COUNT_CHANGED
              - SESSION_ASSEMBLY_STATUS_CHANGED
              - SESSION_QUALITY_STATUS_CHANGED
              - STREAM_ADDED
              - STREAM_REMOVED
              - STREAM_ASSET_SHA256_CHANGED
              - STREAM_QUALITY_REVIEW_DECISION_CHANGED
              - STREAM_QUALITY_REVIEW_VERSION_CHANGED
              - STREAM_ANNOTATION_REVISION_CHANGED
              - STREAM_ANNOTATION_DOCUMENT_SHA256_CHANGED
              - STREAM_LABEL_SCHEMA_DIGEST_CHANGED
              - STREAM_CLEANING_RESULT_CHANGED
              - STREAM_CLEANING_RUN_CHANGED
              - STREAM_CLEANING_RULE_SET_DIGEST_CHANGED
              - STREAM_POST_CLEANING_OUTCOME_CHANGED

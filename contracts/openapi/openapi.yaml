        review their own revision and the audit records SELF_ADMIN_APPROVAL. The CaptureGroup quality
        admission and confirmed View Set must remain current. P0 records one immutable APPROVED or
        REJECTED decision. A rejection returns the task to its assignee; their next immutable revision
        receives the next revision number. An approval completes the task and persists the deterministic
        CaptureGroup Cleaning result for that exact immutable revision. Older revisions, reviews and
        cleaning results remain immutable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: annotation_revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:

  /upload/{batch_id}/abort:
    put:
      operationId: abortUploadBatch
      tags:
        - Uploads
      summary: Terminate an incomplete upload batch and durably schedule storage cleanup
      description: >-
        Idempotently terminates an INITIATED or UPLOADING batch. Only the recorded batch initiator
        with an ACTIVE membership or an ACTIVE project ADMIN may call this command. A local token's
        global authority is not treated as project administration. If the server TTL has already
        elapsed, the command records EXPIRED rather than incorrectly recording a user abort.
        Batch and file terminal states, cleanup tasks and an append-only audit event commit in one
        database transaction; S3 Multipart Abort or deletion of an already completed abandoned
        object happens asynchronously through bounded, leased retries. An active file completion
        lease blocks termination. The command never returns storage identifiers or signed URLs.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      responses:
        "200":
          description: >-
            Batch is ABORTED or EXPIRED and cleanup is either unnecessary, pending, running,
            successful or terminally failed after bounded retry.
          headers:
            Cache-Control:
              description: Prevents storage of mutable cleanup state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatchTermination"
        "400":
          description: Path or request ID validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is neither the batch initiator nor a project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Batch does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Batch is completed or otherwise not abortable, or a file completion lease is active.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"

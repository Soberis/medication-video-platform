    ApiError:
      type: object
      additionalProperties: false
      required:
        - error_code
        - error_message
        - retryable
        - request_id
      properties:
        error_code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
        error_message:
          type: string
          minLength: 1
          description: Safe human-readable error message without internal stack details.
        retryable:
          type: boolean
          description: Whether retrying the same operation may succeed without changing the request.
        request_id:
          type: string
          minLength: 1
          description: Request correlation identifier.
        trace_id:
          type:
            - string
            - "null"
          description: Optional distributed trace identifier.
    MediaJobType:
      type: string
      additionalProperties: false
      description: >-
        Allowlist of media job types. Unknown values are rejected at the API boundary.
      enum:
        - MEDIA_PROBE
    MediaJobStatus:
      type: string
      additionalProperties: false
      description: >-
        Lifecycle state of a media job. Creation normally returns QUEUED after the job, first
        attempt and Outbox event commit atomically. RETRY_WAIT means a retryable attempt result was
        accepted and the next attempt is delayed by Outbox available_at. RUNNING and terminal
        states require a lease-matched Worker interaction.
      enum:
        - REQUESTED
        - QUEUED
        - RUNNING
        - RETRY_WAIT
        - SUCCEEDED
        - FAILED
        - CANCEL_REQUESTED
        - CANCELLED
    MediaJobAttemptStatus:
      type: string
      additionalProperties: false
      description: >-
        Lifecycle state of one execution attempt. LOST records a previously running attempt whose
        lease expired beyond the grace period; it does not mean the business job is terminal.
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - LOST
        - CANCELLED
    MediaJobRequest:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - job_type
      properties:
        clip_asset_id:
          type: string
          format: uuid
          description: Identifier of a previously completed and verified uploaded clip asset.
        job_type:
          $ref: "#/components/schemas/MediaJobType"
    MediaJobReplayRequest:
      type: object
      additionalProperties: false
      required:
        - dead_letter_id
        - source_message_id
        - source_attempt
        - dead_letter_reason
        - body_sha256
        - operator_reason_code
        - change_reference
      properties:
        dead_letter_id:
          type: string
          format: uuid
          description: Deterministic UUIDv5 from the sanitized diagnostic reason and body digest.
        source_message_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        dead_letter_reason:
          type: string
          enum:
            - MEDIA_JOB_ACQUIRE_REJECTED
            - MEDIA_JOB_LEASE_REJECTED
            - MEDIA_JOB_RESULT_REJECTED
          description: >-
            Stable reason from media-dead-letter.v1. MEDIA_JOB_CONTRACT_INVALID is intentionally
            excluded because it has no trusted job identity.
        body_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 from the sanitized diagnostic, never the original message body.
        operator_reason_code:
          type: string
          enum:
            - CONFIGURATION_FIXED
            - WORKER_DEPLOYMENT_FIXED
            - AUTHORIZATION_FIXED
            - OTHER_APPROVED
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]+$
          description: Non-sensitive ticket, deployment or commit reference supporting the replay.
    MediaJobReplayResponse:
      type: object
      additionalProperties: false
      required:
        - replay_id
        - media_job_id
        - dead_letter_id
        - source_attempt
        - new_attempt
        - resulting_job_status
        - created_at
      properties:
        replay_id:
          type: string
          format: uuid
        media_job_id:
          type: string
          format: uuid
        dead_letter_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        new_attempt:
          type: integer
          minimum: 2
        resulting_job_status:
          type: string
          const: QUEUED
          description: State committed by the original replay command, not a live job-status read.
        created_at:
          type: string
          format: date-time
    MediaJobDeliveryRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - source_message_id
        - source_attempt
        - recovery_reason
        - change_reference
      properties:
        source_message_id:
          type: string
          format: uuid

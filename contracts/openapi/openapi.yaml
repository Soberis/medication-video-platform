      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        can_create_projects:
          type: boolean
          description: True only when the authenticated identity has provisioning administrator authority.
    ProjectMembershipRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectMembership:
      type: object

  /media-jobs:
    post:
      operationId: createMediaJob
      tags:
        - Media Jobs
      summary: Create a media probe job for a verified uploaded clip asset
      description: >-
        Persists a media job, attempt 1 and an Outbox dispatch envelope atomically for the
        authenticated project, then returns the durable QUEUED state. The job is uniquely
        identified by the (project_id, job_type, clip_asset_id, input_digest, recipe_digest)
        tuple; the server binds it to the approved media-probe-baseline-v1 profile and returns an
        existing job with the same tuple idempotently. Callers cannot supply arbitrary probe
        recipes. The same Idempotency-Key reused with a different request body is rejected with
        IDEMPOTENCY_KEY_REUSED. The dispatch envelope contains only project/asset identities,
        digests, approved profile identity and the attempt lease token; it does not expose object
        storage locations or signed URLs. Its contract is media-probe-job-v1.schema.json and the
        Worker result contract is media-probe-result-v1.schema.json.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobRequest"
      responses:
        "202":
          description: Job durably queued through the Transactional Outbox or returned idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
            Location:
              schema:
                type: string
                format: uri-reference
              description: Canonical URL of the created job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "400":
          description: The request body or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not authorized for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The referenced clip asset was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The Idempotency-Key was reused with a different request body, or the clip asset is
            not in a probeable state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"

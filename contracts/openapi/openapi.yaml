      operationId: recheckAnnotationPostCleaning
      tags:
        - Annotation Tasks
      summary: Re-evaluate an approved annotation revision against current training facts
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership. The revision must remain APPROVED, its

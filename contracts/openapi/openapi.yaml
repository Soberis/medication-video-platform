        "409":
          description: >-
            The clip is not ingested, the idempotency key conflicts, or the reassessment does not
            explicitly supersede the current version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /privacy-assessments/{privacy_assessment_id}:
    get:
      operationId: getPrivacyAssessment
      tags:
        - Privacy Assessments
      summary: Read one project-scoped privacy assessment version
      parameters:
        - name: privacy_assessment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Immutable human assessment evidence.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyAssessmentResponse"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The assessment was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clip-assets/{clip_asset_id}/privacy-status:
    get:
      operationId: getClipAssetPrivacyStatus
      tags:
        - Privacy Assessments
      summary: Read the current default-deny privacy projection for a clip asset
      description: >-
        Returns UNKNOWN and BLOCKED when the ingested asset has no assessment. A recorded NONE,
        SUSPECTED or CONFIRMED assessment also remains BLOCKED until a separate release decision exists.
      parameters:
        - name: clip_asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current project-scoped privacy projection.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyStatusResponse"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The clip asset was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /quarantines:
    get:
      operationId: getClipAssetQuarantineStatus
      tags:
        - Quarantines
      summary: Read the active quarantine status for a clip asset
      description: >-
        Administrator-only safe read. Returns the current active quarantine records for an ingested
        clip asset in the authenticated project. NONE means no active quarantine record exists; it
        does not constitute a privacy release decision. This operation never creates, releases,
        destroys or physically moves media.
      parameters:
        - name: clip_asset_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current project-scoped quarantine status for the clip asset.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Prevents clients from displaying stale quarantine state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineStatusResponse"
        "400":
          description: The required clip asset identifier is missing or malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The clip asset was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The quarantine status could not be evaluated due to an unexpected internal error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/lease:
    post:
      operationId: acquireMediaJobLease
      tags:
        - Media Jobs
      summary: Exchange the current attempt capability for a short-lived input grant
      description: >-
        Internal Worker endpoint. Verifies the independent Worker service identity and the
        SHA-256-backed attempt lease token, moves the job and asset to RUNNING/INGESTING atomically,
        and returns a short-lived read-only URL. The URL is never persisted or logged by the platform.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaLeaseRequest"
      responses:
        "200":
          description: The current attempt owns an active lease and received a read grant.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLeaseResponse"
        "400":
          description: The path, header or request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or clip asset was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt or lease is stale, invalid, active elsewhere or terminal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not issue the read grant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/heartbeat:
    post:
      operationId: renewMediaJobLease
      tags:
        - Media Jobs
      summary: Renew the current Worker's active attempt lease
      description: >-
        Internal Worker endpoint. The service identity, opaque lease capability, current attempt,
        worker ID and unexpired lease must all match. A successful heartbeat sets lease_until to
        the current server time plus the configured lease duration; it never revives an expired or
        lost attempt and never accumulates lease time from the previous deadline.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaLeaseRequest"
      responses:
        "200":
          description: The current Worker's active lease was renewed.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaHeartbeatResponse"
        "400":
          description: The path, header or request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or attempt was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt, Worker ownership or lease is stale, expired or terminal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /internal/media-jobs/{media_job_id}/attempts/{attempt}/result:
    put:
      operationId: acceptMediaProbeResult
      tags:
        - Media Jobs
      summary: Idempotently accept the current media probe attempt result
      description: >-
        Internal Worker endpoint. Validates the service identity, lease, job/attempt/message IDs,
        input/recipe/software digests, timestamps and the frozen media-probe-result.v1 contract.
        A successful result creates one immutable MediaReport and marks the asset INGESTED. A
        retryable failed result stores stable attempt diagnostics, keeps the asset INGESTING and
        schedules a new attempt with bounded backoff; a non-retryable or exhausted failure marks
        the asset INGEST_FAILED. Failed attempts never create a report. Inbox deduplication absorbs
        an exact replay.
      security:
        - workerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/MediaJobAttempt"
        - $ref: "#/components/parameters/MediaLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../events/media-probe-result-v1.schema.json"
      responses:
        "200":
          description: Result accepted, or the exact previously accepted result replayed.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResultAcceptedResponse"
        "400":
          description: The result violates the frozen request contract.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The Worker software digest is not approved.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job or clip asset was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt/result is stale, mismatched, expired or reuses a message ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: actor_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$
    FolderId:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClipAssetId:
      name: clip_asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-generated correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped to the current project and write operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    MediaJobId:
      name: media_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaJobAttempt:
      name: attempt
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MediaLeaseToken:
      name: X-Media-Lease-Token
      in: header
      required: true
      description: Opaque capability from the current restricted broker envelope; never log it.
      schema:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Edge or service bearer token. Local development uses a synthetic bearer adapter and must
        never reuse hospital or production credentials.
    sessionCookie:
      type: apiKey
      in: cookie
      name: MVPSESSION
      description: HttpOnly session cookie for an internal platform-account browser session.
    workerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
      description: >-
        Independent Worker service identity. It is not a user/project bearer token and is accepted
        only by the internal media job endpoints.
  headers:
    NoStore:
      description: Prevents clients and intermediaries from retaining authorization-sensitive data.
      schema:
        type: string
        const: no-store
  schemas:
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
    PlatformSession:
      type: object
      additionalProperties: false
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    ProjectStatus:
      type: string
      enum:
        - ACTIVE
    MembershipStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
    Project:
      type: object
      additionalProperties: false
      required:
        - project_id
        - display_name
        - status
        - current_role
        - created_at
      properties:
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: "#/components/schemas/ProjectStatus"
        current_role:
          $ref: "#/components/schemas/ProjectRole"
        created_at:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - items
        - can_create_projects
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        can_create_projects:
          type: boolean
          description: True only when the authenticated identity has provisioning administrator authority.
    ProjectMembershipRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectMembership:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - project_id
        - actor_id
        - role
        - status
        - version
        - updated_at
      properties:
        membership_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        actor_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    ProjectMembershipList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
    AssetFolderRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    AssetFolder:
      type: object
      additionalProperties: false
      required:
        - folder_id
        - project_id
        - display_name
        - version
        - created_at
        - updated_at
      properties:
        folder_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssetFolderList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetFolder"
    ClipAssetFolderRequest:
      type: object
      additionalProperties: false
      required:
        - folder_id
      properties:
        folder_id:
          type: string
          format: uuid
    ClipAssetFolder:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - project_id
        - version
        - updated_at
      properties:
        clip_asset_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          description: Omitted when the ClipAsset is in the unclassified project view.
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    UploadBatchInitRequest:
      type: object
      additionalProperties: false
      required:
        - project_id
        - device_id
        - file_count
        - total_size_bytes
        - manifest_sha256
      properties:
        project_id:
          type: string
          format: uuid
          description: Project that owns the batch; authorization enforcement is handled separately.
        device_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: >-
            Stable non-personal identifier of the uploading edge device. PLATFORM_LOCAL is required
            when upload_source_type is PLATFORM_LOCAL.
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
          default: HOSPITAL_REMOTE
          description: Immutable upload-entry provenance. Omitted requests remain HOSPITAL_REMOTE for compatibility.
        asset_folder_id:
          type: [string, "null"]
          format: uuid
          description: Optional project folder for a PLATFORM_LOCAL video; never an object-storage path or permission boundary.
        file_count:
          type: integer
          format: int32
          minimum: 1
          description: Number of files declared by the immutable batch manifest.
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Sum of declared file sizes; large values including files over 2GB are supported.
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: >-
            SHA-256 of upload-file-manifest-v1. Encode UTF-8 text beginning with
            `upload-file-manifest-v1\n`; sort entries by lowercase client_file_id; append one line
            per file as `client_file_id<TAB>file_kind<TAB>content_type<TAB>size_bytes<TAB>sha256<TAB>part_size_bytes\n`.
            Excludes credentials, signed URLs, storage upload IDs and server-assigned IDs.
    UploadBatch:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - device_id
        - upload_source_type
        - file_count
        - total_size_bytes
        - manifest_sha256
        - status
        - expires_at
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        device_id:
          type: string
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
        asset_folder_id:
          type: [string, "null"]
          format: uuid
        file_count:
          type: integer
          format: int32
        total_size_bytes:
          type: integer
          format: int64
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: "#/components/schemas/UploadBatchStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PrivacyAssessmentRequest:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - risk_level
        - required_action
        - reason_code
        - finding_types
      properties:
        clip_asset_id:
          type: string
          format: uuid
        supersedes_assessment_id:
          type:
            - string
            - "null"
          format: uuid
          description: Required and equal to the current assessment id when creating version 2 or later.
        risk_level:
          $ref: "#/components/schemas/PrivacyRiskLevel"
        required_action:
          $ref: "#/components/schemas/PrivacyRequiredAction"
        reason_code:
          $ref: "#/components/schemas/PrivacyAssessmentReasonCode"
        finding_types:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PrivacyFindingType"
    PrivacyAssessmentResponse:
      type: object
      additionalProperties: false
      required:
        - privacy_assessment_id
        - project_id
        - clip_asset_id
        - input_digest
        - assessment_version
        - assessment_method
        - policy_key
        - policy_digest
        - risk_level
        - required_action
        - privacy_release_status
        - finding_types
        - reason_code
        - assessed_by
        - assessed_at
      properties:
        privacy_assessment_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        clip_asset_id:
          type: string
          format: uuid
        input_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        assessment_version:
          type: integer
          minimum: 1
        assessment_method:
          type: string
          const: HUMAN_REVIEW
        policy_key:
          type: string
          const: privacy-assessment-policy-v1
        policy_digest:
          type: string
          const: d5d18c436d401a223832f1c85b6ff076de01a9dddeecb879268ff89bc5719517
        risk_level:
          $ref: "#/components/schemas/PrivacyRiskLevel"
        required_action:
          $ref: "#/components/schemas/PrivacyRequiredAction"
        privacy_release_status:
          type: string
          const: BLOCKED
        finding_types:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PrivacyFindingType"
        reason_code:
          $ref: "#/components/schemas/PrivacyAssessmentReasonCode"
        assessed_by:
          type: string
          minLength: 1
          maxLength: 128
        supersedes_assessment_id:
          type:
            - string
            - "null"
          format: uuid
        assessed_at:
          type: string
          format: date-time
    PrivacyStatusResponse:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - input_digest
        - risk_level
        - privacy_release_status
      properties:
        clip_asset_id:
          type: string
          format: uuid
        input_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        risk_level:
          type: string
          enum:
            - UNKNOWN
            - NONE
            - SUSPECTED
            - CONFIRMED
        required_action:
          oneOf:
            - $ref: "#/components/schemas/PrivacyRequiredAction"
            - type: "null"
        privacy_release_status:
          type: string
          const: BLOCKED
        current_assessment:
          oneOf:
            - $ref: "#/components/schemas/PrivacyAssessmentResponse"
            - type: "null"
    PrivacyRiskLevel:
      type: string
      enum:
        - NONE
        - SUSPECTED
        - CONFIRMED
    PrivacyRequiredAction:
      type: string
      enum:
        - RELEASE_REVIEW_REQUIRED
        - DEIDENTIFICATION_REQUIRED
        - QUARANTINE_REQUIRED
    PrivacyAssessmentReasonCode:
      type: string
      enum:
        - NO_IDENTIFIABLE_INFORMATION_OBSERVED
        - IDENTIFIABLE_INFORMATION_OBSERVED
        - RISK_REQUIRES_ISOLATION
    PrivacyFindingType:
      type: string
      enum:
        - FACE
        - NAME
        - MEDICAL_RECORD_ID
        - SCREEN
        - BADGE
        - ORDER_TEXT
        - LABEL_TEXT
        - VOICE
        - OTHER
    QuarantineStatusResponse:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - input_digest
        - quarantine_status
        - active_records
      properties:
        clip_asset_id:
          type: string
          format: uuid

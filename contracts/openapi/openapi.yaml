  /projects/{project_id}/clip-assets/{clip_asset_id}/media-probe-jobs:
    post:
      operationId: requestClipAssetMediaProbe
      tags:
        - Media Jobs
      summary: Explicitly start the baseline media check for one uploaded video
      description: >-
        Requires an authenticated account with an ACTIVE ADMIN or MEMBER membership in the
        explicit project. It accepts only an undeleted video asset in UPLOADED state, atomically
        creates (or returns) the one baseline MEDIA_PROBE job, attempt and Outbox envelope, and
        returns the durable queued job. This request does not play the video and does not block
        direct human playback; successful technical validation is required before a quality
        conclusion can be recorded or the video enters the annotation flow.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: clip_asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Probe job queued or the same immutable input was already queued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri-reference
              description: Canonical URL of the media job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "400":
          description: The project, clip asset or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller has no active membership in the project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project or active video asset is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The asset is deleted, no longer UPLOADED or conflicts with the request key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"

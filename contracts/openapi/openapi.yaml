        - actor_id
        - role
        - status
        - version
        - updated_at
      properties:
        membership_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        actor_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    ProjectMembershipList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
    UploadBatchInitRequest:
      type: object
      additionalProperties: false
      required:
        - project_id
        - device_id
        - file_count
        - total_size_bytes
        - manifest_sha256
      properties:
        project_id:
          type: string
          format: uuid
          description: Project that owns the batch; authorization enforcement is handled separately.
        device_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: >-
            Stable non-personal identifier of the uploading edge device. PLATFORM_LOCAL is required
            when upload_source_type is PLATFORM_LOCAL.
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
          default: HOSPITAL_REMOTE
          description: Immutable upload-entry provenance. Omitted requests remain HOSPITAL_REMOTE for compatibility.
        file_count:
          type: integer
          format: int32
          minimum: 1
          description: Number of files declared by the immutable batch manifest.
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Sum of declared file sizes; large values including files over 2GB are supported.
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: >-
            SHA-256 of upload-file-manifest-v1. Encode UTF-8 text beginning with
            `upload-file-manifest-v1\n`; sort entries by lowercase client_file_id; append one line
            per file as `client_file_id<TAB>file_kind<TAB>content_type<TAB>size_bytes<TAB>sha256<TAB>part_size_bytes\n`.
            Excludes credentials, signed URLs, storage upload IDs and server-assigned IDs.
        external_manifest_id:
          type: [string, "null"]
          format: uuid
          description: Persisted explicit external camera manifest to bind to this upload batch.
    UploadBatch:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - device_id
        - upload_source_type
        - file_count
        - total_size_bytes
        - manifest_sha256
        - status
        - expires_at
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        device_id:
          type: string
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
        external_manifest_id:
          type: [string, "null"]
          format: uuid
        file_count:
          type: integer
          format: int32
        total_size_bytes:
          type: integer
          format: int64
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: "#/components/schemas/UploadBatchStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UploadSourceType:
      type: string
      enum:
        - HOSPITAL_REMOTE
        - PLATFORM_LOCAL
    UploadBatchStatus:
      type: string
      enum:
        - INITIATED
        - UPLOADING
        - COMPLETING
        - COMPLETED
        - FAILED
        - ABORTED
        - EXPIRED
    UploadCleanupStatus:
      type: string
      enum:
        - NOT_REQUIRED
        - PENDING
        - IN_PROGRESS
        - SUCCEEDED
        - FAILED
      description: >-
        Durable cleanup projection. FAILED means the bounded retry limit was reached and requires
        operator intervention; it never changes the already committed batch terminal state.
    UploadBatchTermination:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - status
        - termination_reason_code
        - terminated_at
        - cleanup_status
        - cleanup_task_count
        - completed_cleanup_task_count
        - failed_cleanup_task_count
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ABORTED
            - EXPIRED
        termination_reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        terminated_at:
          type: string
          format: date-time
        cleanup_status:
          $ref: "#/components/schemas/UploadCleanupStatus"
        cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        completed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        failed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
    UploadBatchCompletion:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - status
        - file_count
        - total_size_bytes
        - manifest_sha256
        - verified_manifest_sha256
        - clip_asset_count
        - clip_assets
        - completed_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        status:
          type: string
          const: COMPLETED
        file_count:
          type: integer
          format: int32
          minimum: 1
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        verified_manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        clip_asset_count:
          type: integer
          format: int32
          minimum: 1
        clip_assets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClipAssetBinding"
        completed_at:
          type: string
          format: date-time
    ClipAssetBinding:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - source_upload_file_id
        - client_file_id
        - content_type
        - size_bytes
        - sha256
        - status
      properties:
        clip_asset_id:
          type: string
          format: uuid
        source_upload_file_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        content_type:
          type: string
          minLength: 3
          maxLength: 128
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          const: UPLOADED
    UploadBatchProgress:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - device_id
        - upload_source_type
        - file_count
        - registered_file_count
        - uploaded_file_count
        - failed_file_count
        - total_size_bytes
        - uploaded_size_bytes
        - tracked_part_count
        - uploaded_part_count
        - status
        - cleanup_status
        - cleanup_task_count
        - completed_cleanup_task_count
        - failed_cleanup_task_count
        - terminated_at
        - termination_reason_code
        - expires_at
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        device_id:
          type: string
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
        external_manifest_id:
          type: [string, "null"]
          format: uuid
        file_count:
          type: integer
          format: int32
          minimum: 1
          description: File count declared by the immutable batch manifest.
        registered_file_count:
          type: integer
          format: int32
          minimum: 0
          description: File manifest entries currently registered in the platform.
        uploaded_file_count:
          type: integer
          format: int32
          minimum: 0
          description: Files that passed Multipart Complete, final size and full-file SHA-256 checks.
        failed_file_count:
          type: integer
          format: int32
          minimum: 0
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Total bytes declared by the immutable batch manifest.
        uploaded_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Sum of storage-backed, platform-confirmed Part bytes.
        tracked_part_count:
          type: integer
          format: int64
          minimum: 0
        uploaded_part_count:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/UploadBatchStatus"
        cleanup_status:
          $ref: "#/components/schemas/UploadCleanupStatus"
        cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        completed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        failed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        terminated_at:
          type:
            - string
            - "null"
          format: date-time
        termination_reason_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UploadFileRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - file_kind
        - content_type
        - size_bytes
        - sha256
        - part_size_bytes
      properties:
        file_kind:
          $ref: "#/components/schemas/UploadFileKind"
        content_type:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*/[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*$
          description: Media type only; parameters and source file paths are not accepted.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        part_size_bytes:
          type: integer
          format: int64
          minimum: 8388608
          maximum: 67108864
          description: Planned part size from 8 MiB through 64 MiB; the last part may be smaller.
        file_name:
          type: [string, "null"]
          maxLength: 255
          description: Original client filename. Required for PLATFORM_LOCAL videos and for videos bound to an external ingest manifest.
    UploadFile:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - file_kind
        - content_type
        - size_bytes
        - sha256
        - part_size_bytes
        - total_parts
        - status
        - created_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        file_name:
          type: [string, "null"]
          maxLength: 255
        file_kind:
          $ref: "#/components/schemas/UploadFileKind"
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        part_size_bytes:
          type: integer
          format: int64
        total_parts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        status:
          $ref: "#/components/schemas/UploadFileStatus"
        created_at:
          type: string
          format: date-time
    UploadFileKind:
      type: string
      enum:
        - VIDEO
        - METADATA
        - EVENT_LOG
    UploadFileStatus:
      type: string
      enum:
        - REGISTERED
        - SESSION_CREATED
        - UPLOADING
        - COMPLETING
        - UPLOADED
        - FAILED
        - ABORTED
        - EXPIRED
    UploadFileProgressList:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - registered_file_count
        - files
      properties:
        batch_id:
          type: string
          format: uuid
        registered_file_count:
          type: integer
          format: int32
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/UploadFileProgress"
    UploadFileProgress:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - file_kind
        - content_type
        - size_bytes
        - declared_sha256
        - verified_sha256
        - total_parts
        - tracked_parts
        - uploaded_parts
        - uploaded_size_bytes
        - status
        - completion_error_code
        - multipart_created_at
        - completion_started_at
        - completed_at
        - created_at
        - updated_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        file_kind:
          $ref: "#/components/schemas/UploadFileKind"
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        declared_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        verified_sha256:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        total_parts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        tracked_parts:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        uploaded_parts:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        uploaded_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Sum of storage-backed, platform-confirmed Part bytes for this file.
        status:
          $ref: "#/components/schemas/UploadFileStatus"
        completion_error_code:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
          description: Stable failure code persisted when final verification fails.
        multipart_created_at:
          type:
            - string
            - "null"
          format: date-time
        completion_started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UploadMultipartSession:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - total_parts
        - status
        - multipart_created_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        total_parts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        status:
          $ref: "#/components/schemas/UploadFileStatus"
        multipart_created_at:
          type: string
          format: date-time
    UploadPartAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of this exact part, represented as lowercase hexadecimal.
    UploadPartAuthorization:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - part_number
        - expected_size_bytes
        - sha256
        - status
        - upload_url
        - expires_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        part_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Exact byte length expected for this part according to the immutable file manifest.
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: "#/components/schemas/UploadPartStatus"
        upload_url:
          type: string
          format: uri
          description: Short-lived credential for an HTTP PUT; never persist or log this value.
        expires_at:
          type: string
          format: date-time
    UploadPartStatus:
      type: string
      enum:
        - AUTHORIZED
        - UPLOADED
    ConfirmedUploadPart:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - part_number
        - expected_size_bytes
        - sha256
        - status
        - uploaded_size_bytes
        - storage_etag
        - confirmed_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        part_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Client-declared part digest; final file verification remains authoritative.
        status:
          type: string
          const: UPLOADED
        uploaded_size_bytes:
          type: integer
          format: int64
          minimum: 1
        storage_etag:
          type: string
          minLength: 1
          maxLength: 2048
          description: Opaque object-storage ETag observed by the platform, not supplied by the caller.
        confirmed_at:
          type: string
          format: date-time
    UploadPartProgress:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - part_number
        - expected_size_bytes
        - sha256
        - status
      properties:
        upload_file_id:
          type: string
          format: uuid
        part_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: "#/components/schemas/UploadPartStatus"
        uploaded_size_bytes:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
        storage_etag:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2048
        confirmed_at:
          type:
            - string
            - "null"
          format: date-time
    UploadPartProgressList:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - total_parts
        - tracked_parts
        - uploaded_parts
        - parts
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        total_parts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        tracked_parts:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        uploaded_parts:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        parts:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/UploadPartProgress"
    UploadFileCompletion:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - size_bytes
        - declared_sha256
        - verified_sha256
        - status
        - storage_etag
        - completion_started_at
        - completed_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        declared_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        verified_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Full-file SHA-256 calculated by streaming the completed object.
        status:
          type: string
          const: UPLOADED
        storage_etag:
          type: string
          minLength: 1
          maxLength: 2048
          description: Opaque completed-object ETag; it is not used as the file SHA-256.
        completion_started_at:

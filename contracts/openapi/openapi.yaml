        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested project or event-log index not found in the actor's visible scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs:
    post:
      operationId: createMediaJob
      tags:
        - Media Jobs
      summary: Create a media probe job for a verified uploaded clip asset
      description: >-
        Persists a media job, attempt 1 and an Outbox dispatch envelope atomically for the
        authenticated project, then returns the durable QUEUED state. The job is uniquely
        identified by the (project_id, job_type, clip_asset_id, input_digest, recipe_digest)
        tuple; the server binds it to the approved media-probe-baseline-v1 profile and returns an
        existing job with the same tuple idempotently. Callers cannot supply arbitrary probe
        recipes. The same Idempotency-Key reused with a different request body is rejected with
        IDEMPOTENCY_KEY_REUSED. The dispatch envelope contains only project/asset identities,
        digests, approved profile identity and the attempt lease token; it does not expose object
        storage locations or signed URLs. Its contract is media-probe-job-v1.schema.json and the
        Worker result contract is media-probe-result-v1.schema.json.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobRequest"
      responses:
        "202":
          description: Job durably queued through the Transactional Outbox or returned idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
            Location:
              schema:
                type: string
                format: uri-reference
              description: Canonical URL of the created job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "400":
          description: The request body or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not authorized for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The referenced clip asset was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The Idempotency-Key was reused with a different request body, or the clip asset is
            not in a probeable state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}:
    get:
      operationId: getMediaJob
      tags:
        - Media Jobs
      summary: Read a media probe job by id
      description: >-
        Returns the persisted job for the authenticated project. This read operation does not
        dispatch, retry or transition the job. The current attempt exposes safe terminal diagnostics
        but never exposes lease tokens, Worker identifiers or storage locations.
      parameters:
        - name: media_job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media job detail.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobResponse"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/replays:
    post:
      operationId: replayDeadLetteredMediaJob
      tags:
        - Media Jobs
      summary: Create an audited new attempt from a retained sanitized dead-letter diagnostic
      description: >-
        Administrator-only recovery command. The caller copies only the safe identity fields from
        a retained media-dead-letter.v1 diagnostic. The server verifies the deterministic
        dead_letter_id, current job/message/attempt identity, project boundary, replay limit and
        idempotency key; it then marks the old attempt failed and atomically creates a new attempt,
        lease capability, message ID, Outbox event, replay record and append-only audit event. The
        DLQ body is never republished, and the original diagnostic remains immutable evidence.
        Invalid-contract diagnostics without a trusted job identity cannot be replayed through this
        endpoint.
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          description: Optional caller correlation id copied into the audit event.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobReplayRequest"
      responses:
        "202":
          description: New attempt queued, or the exact command replayed idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobReplayResponse"
        "400":
          description: The diagnostic fields, change reference or idempotency key are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The diagnostic does not match the current attempt, the replay limit or job state was
            reached, or the idempotency key/dead-letter identity conflicts with another command.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/delivery-recoveries:
    post:
      operationId: recoverMissingMediaJobDelivery
      tags:
        - Media Jobs
      summary: Replace one confirmed missing broker delivery with a new audited attempt
      description: >-
        Administrator-only disaster-recovery command for a current QUEUED attempt whose
        publisher-confirmed RabbitMQ message is known to be absent. The server does not inspect
        broker queues or republish automatically. It locks the current project/job/attempt, marks
        only the source attempt failed with BROKER_MESSAGE_LOST, creates a fresh attempt, lease
        capability, message ID and Outbox envelope, and records immutable recovery and audit facts.
        A source message can be recovered once; the normal maximum-attempt policy remains in force.
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobDeliveryRecoveryRequest"
      responses:
        "202":
          description: A new attempt was queued, or the exact recovery command was replayed idempotently.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobDeliveryRecoveryResponse"
        "400":
          description: The recovery command or Idempotency-Key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is not an administrator for the current project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media job was not found in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The source is stale, already recovered, non-queued, or reached its attempt limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /media-jobs/{media_job_id}/report:

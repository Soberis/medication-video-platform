          format: uuid
        clip_asset_id:
          type: [string, "null"]
          format: uuid
        camera_channel_id:
          type: [string, "null"]
          format: uuid
        present:
          type: boolean
        media_status:
          type: string
          minLength: 1
          maxLength: 32
        technical_quality_status:
          type: [string, "null"]
          maxLength: 32
        stream_version:
          type: integer
          format: int64
          minimum: 0
        clip_asset_version:
          type: integer
          format: int64
          minimum: 0
        asset_available:
          type: boolean
        quality_review_decision:
          type: string
          enum:
            - UNREVIEWED
            - QUALIFIED
            - NEEDS_REVIEW
            - REJECTED
        quality_review_version:
          type: integer
          format: int64
          minimum: 0
    CaptureGroupViewSet:
      type: object

            - type: string
              maxLength: 512
            - type: "null"
    ClipAssetActivityItem:
      type: object
      additionalProperties: false
      required:
        - event_id
        - occurred_at_utc
        - actor_type
        - actor_id
        - action
        - object_type
        - object_id
        - object_version
        - outcome
        - reason_code
        - request_id
      properties:
        event_id:
          type: string
          format: uuid

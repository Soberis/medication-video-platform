        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetVersion"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
    DatasetVersionDetail:
      type: object
      additionalProperties: false
      required:
        - dataset_version_id
        - project_id
        - display_name
        - status
        - created_by
        - created_at
        - members
        - split_plan
        - can_create_split_plan
        - build_specification
        - can_create_build_specification
        - build_snapshot
        - can_create_build_snapshot
        - validation
        - can_validate
        - freeze_approval
        - can_freeze
        - export_request
        - can_request_export
      properties:
        dataset_version_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [DRAFT, BUILDING, VALIDATING, FROZEN]
        created_by:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DatasetMemberSession"
        split_plan:
          description: The immutable pilot/holdout plan, or null before an administrator creates it.
          oneOf:
            - $ref: "#/components/schemas/DatasetSplitPlan"
            - type: "null"
        can_create_split_plan:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, the DRAFT has at
            least two members and no split plan exists. This is UI capability metadata, not freeze
            or release authorization.
        build_specification:
          description: The immutable minimum build configuration, or null before it is fixed.
          oneOf:
            - $ref: "#/components/schemas/DatasetBuildSpecification"
            - type: "null"
        can_create_build_specification:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, an immutable split
            plan exists, no build specification exists and all snapshot streams use one label schema
            and one cleaning rule set. This does not authorize state transition, freeze or export.
        build_snapshot:
          description: The immutable relational snapshot seal, or null until BUILDING completes.
          oneOf:
            - $ref: "#/components/schemas/DatasetBuildSnapshot"
            - type: "null"
        can_create_build_snapshot:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, the DatasetVersion
            is BUILDING and no build snapshot exists. This does not authorize freezing or export.
        validation:
          description: The immutable freeze-preflight PASS or FAIL result, or null before it runs.
          oneOf:
            - $ref: "#/components/schemas/DatasetVersionValidation"
            - type: "null"
        can_validate:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, the DatasetVersion
            is VALIDATING and no validation result exists. It does not authorize approval, freeze
            or export.
        freeze_approval:
          description: >-
            The pending or approved freeze request bound to the PASS validation, or null when no
            passing validation exists.
          oneOf:
            - $ref: "#/components/schemas/DatasetVersionFreezeApproval"
            - type: "null"
        can_freeze:
          type: boolean
          description: >-
            True only for a ROLE_ADMIN account with an ACTIVE project ADMIN membership while a
            PASS-bound freeze request is pending. Under V1.11 the requester may approve the same
            request; the command still revalidates every technical guard and records
            SELF_ADMIN_APPROVAL when both actors are the same.
        export_request:
          description: >-
            The immutable P0 export request and its pending approval, or null before an administrator
            requests export of the FROZEN version. REQUESTED does not mean queued or available.
          oneOf:
            - $ref: "#/components/schemas/DatasetExport"
            - type: "null"
        can_request_export:
          type: boolean
          description: >-
            True only when the current actor is an ACTIVE project administrator, the DatasetVersion
            is FROZEN and no export request exists. The command still validates expiry and evidence.
    DatasetSplitPlanCreateRequest:
      type: object
      additionalProperties: false

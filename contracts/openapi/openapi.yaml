          format: date-time
        completed_at:
          type: string
          format: date-time
    CaptureSessionMetadataV1:
      $ref: "../schemas/capture-session-metadata-v1.schema.json"
    CaptureSession:
      type: object
      additionalProperties: false
      required:
        - capture_session_id
        - capture_group_id
        - project_id
        - batch_id
        - device_id
        - metadata_schema_version
        - expected_camera_count
        - received_camera_count
        - server_receive_time
        - assembly_status
        - quality_status
        - expected_camera_numbers
        - received_camera_numbers
        - missing_camera_numbers
        - receipt_state
        - camera_set_snapshot
        - streams
        - created_at
      properties:
        capture_session_id:
          type: string
          format: uuid
        capture_group_id:
          type: string
          format: uuid
          description: V1.28 business identity; exactly the same UUID as capture_session_id.
        project_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        device_id:
          type: string
          minLength: 1
          maxLength: 128
        metadata_upload_file_id:
          type: [string, "null"]
          format: uuid
        metadata_schema_version:
          type: string
          enum:
            - capture-session-metadata-v1
            - platform-local-upload-v1
        metadata_sha256:
          type: [string, "null"]
          pattern: ^[a-f0-9]{64}$
        expected_camera_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Enabled-member count derived from the frozen server CameraSet.
        received_camera_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          description: >-
            V1.28 CaptureGroup responses count unique streams actually bound to the frozen snapshot.
            The CaptureGroup receipt count is independent of media probe status.
        sync_group_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
        device_time_utc:
          type: [string, "null"]
          format: date-time
        device_timezone:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
        server_receive_time:
          type: string
          format: date-time
        assembly_status:
          $ref: "#/components/schemas/CaptureSessionAssemblyStatus"
        quality_status:
          $ref: "#/components/schemas/CaptureQualityStatus"
        capture_group_key:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: Explicit upstream group key; never derived from filenames or timing.
        capture_group_key_source:
          type: [string, "null"]
          enum: [EXTERNAL_CAPTURE_SESSION_ID, UPSTREAM_MANIFEST_KEY, null]
        capture_group_manifest_id:
          type: [string, "null"]
          format: uuid
        expected_camera_numbers:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
          description: Stable expected display numbers from the frozen CameraSetSnapshot.
        received_camera_numbers:
          type: array
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
          description: Camera numbers with a bound uploaded ClipAsset; media state does not change this set.
        missing_camera_numbers:
          type: array
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
          description: Expected camera numbers without a bound uploaded file; gaps are never renumbered.
        receipt_state:
          $ref: "#/components/schemas/CaptureGroupReceiptState"
        receipt_finalized_at:
          type: [string, "null"]
          format: date-time
        camera_set_snapshot:
          $ref: "#/components/schemas/CameraSetSnapshot"
        streams:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/CameraStream"
        created_at:
          type: string
          format: date-time
    CameraSetSnapshot:
      type: object
      additionalProperties: false
      required:
        - camera_set_snapshot_id
        - source_camera_set_id
        - camera_set_key
        - configuration_version
        - layout_version
        - expected_camera_count
        - members
      properties:
        camera_set_snapshot_id:
          type: string
          format: uuid
        source_camera_set_id:
          type: string
          format: uuid
        camera_set_key:
          type: string
          minLength: 1
          maxLength: 128
        configuration_version:
          type: integer
          format: int32
          minimum: 1
        layout_version:
          type: string
          minLength: 1
          maxLength: 128
        expected_camera_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
        members:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/CameraSetSnapshotMember"
    CameraSetSnapshotMember:
      type: object
      additionalProperties: false
      required:
        - camera_channel_id
        - camera_index
        - camera_number
        - camera_role
        - mount_position
        - enabled
        - enabled_for_hand_detection
      properties:
        camera_channel_id:
          type: string
          format: uuid
        camera_index:
          type: integer
          format: int32
          minimum: 0
          maximum: 63
          description: Canonical 0-based fixed-camera identity; camera_number is camera_index + 1 and gaps are preserved.
        camera_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Stable 1-based display number derived from the frozen camera_index.
        camera_role:
          type: string
          minLength: 1
          maxLength: 64
        mount_position:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        enabled_for_hand_detection:
          type: boolean
    CameraStream:
      type: object
      additionalProperties: false
      required:
        - camera_stream_id
        - clip_asset_id
        - client_file_id
        - camera_channel_id
        - camera_index
        - camera_number
        - camera_role
        - mount_position
        - record_start_utc
        - time_offset_ms
        - sync_status
        - stream_status
        - quality_status
        - enabled_for_hand_detection
      properties:
        camera_stream_id:
          type: string
          format: uuid
        clip_asset_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        camera_channel_id:
          type: string
          format: uuid
        camera_index:
          type: integer
          format: int32
          minimum: 0
          maximum: 63
          description: Canonical 0-based fixed-camera identity; camera_number is camera_index + 1 and gaps are not renumbered.
        camera_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Stable 1-based display number derived from camera_index; missing cameras are not renumbered.
        camera_role:
          type: string
          minLength: 1
          maxLength: 64
          description: Frozen from the server CameraSet, not accepted as edge configuration truth.
        mount_position:
          type: string
          minLength: 1
          maxLength: 128
          description: Frozen from the server CameraSet, not accepted as edge configuration truth.
        record_start_utc:
          type: string
          format: date-time
        time_offset_ms:
          type: integer
          format: int64
          description: Edge-declared signed offset observation.
        sync_status:
          type: string
          enum:
            - UNKNOWN
            - PASS
            - WARNING
            - REJECT
          description: Edge observation; not a verified StreamSyncRevision or quality decision.
        stream_status:
          type: string
          enum:
            - BOUND
            - INGESTED
            - INGEST_FAILED
        quality_status:
          $ref: "#/components/schemas/CaptureQualityStatus"
        enabled_for_hand_detection:
          type: boolean
    CaptureSessionAssemblyStatus:
      type: string
      enum:
        - OPEN
        - ASSEMBLING
        - COMPLETE
        - INCOMPLETE
        - CLOSED
    CaptureGroupReceiptState:
      type: string
      enum: [RECEIVING, COMPLETE, INCOMPLETE]
      description: >-
        RECEIVING means the upload set is not explicitly finalized. After explicit finalization,
        COMPLETE means every expected camera file is bound and INCOMPLETE preserves the missing numbers.
    CaptureGroup:
      $ref: "#/components/schemas/CaptureSession"
    CaptureGroupListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CaptureGroupSummary" }
        next_cursor:
          anyOf:
            - type: string
              maxLength: 512
            - type: "null"
    CaptureGroupSummary:
      type: object
      additionalProperties: false
      required:
        - capture_group_id
        - capture_group_key
        - device_time_utc
        - receipt_state
        - expected_camera_count
        - received_camera_count
        - missing_camera_numbers
        - created_at
      properties:
        capture_group_id:
          type: string
          format: uuid
        capture_group_key:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
        device_time_utc:
          type: [string, "null"]
          format: date-time
        receipt_state:
          $ref: "#/components/schemas/CaptureGroupReceiptState"
        expected_camera_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
        received_camera_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          description: Unique camera streams actually bound to the frozen snapshot; this receipt count is independent of media probe status.
        missing_camera_numbers:
          type: array
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
          description: Expected camera numbers without a bound uploaded file; gaps are never renumbered.
        created_at:
          type: string
          format: date-time
    CaptureGroupQualityResult:
      type: string
      enum:
        - QUALIFIED
        - QUALIFIED_WITH_EXCLUSIONS
        - NEEDS_REVIEW
        - REJECTED
    CaptureGroupQualityView:

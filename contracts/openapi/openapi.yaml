        object, independently hashes the stored ZIP and registers one immutable artifact before the
        export becomes AVAILABLE. Retryable failures schedule a bounded new attempt through Outbox.
      security:
        - exportWorkerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DatasetExportId"
        - $ref: "#/components/parameters/DatasetExportAttempt"
        - $ref: "#/components/parameters/ExportLeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../events/dataset-export-result-v1.schema.json"
      responses:
        "200":
          description: Result accepted, or an exact Inbox replay returned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExportResultAccepted"
        "400":
          description: The result violates the frozen request contract.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The Export Worker service identity is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The export or attempt was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The attempt/result is stale, mismatched, expired or reuses a message ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: actor_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$
    FolderId:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClipAssetId:
      name: clip_asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DatasetVersionId:
      name: dataset_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-generated correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped to the current project and write operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    MediaJobId:
      name: media_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaJobAttempt:
      name: attempt
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MediaLeaseToken:
      name: X-Media-Lease-Token
      in: header
      required: true
      description: Opaque capability from the current restricted broker envelope; never log it.
      schema:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    AiJobId:
      name: ai_job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AiJobAttempt:
      name: attempt
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AiLeaseToken:
      name: X-AI-Lease-Token
      in: header
      required: true
      description: Opaque capability from the restricted AI broker envelope; never log it.
      schema: { type: string, minLength: 43, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    DatasetExportId:
      name: dataset_export_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DatasetExportAttempt:
      name: attempt
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DatasetExportPartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    ExportLeaseToken:
      name: X-Export-Lease-Token
      in: header
      required: true
      description: Opaque capability from the restricted export envelope; never log or persist it.
      schema:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Edge or service bearer token. Local development uses a synthetic bearer adapter and must
        never reuse hospital or production credentials.
    sessionCookie:
      type: apiKey
      in: cookie
      name: MVPSESSION
      description: HttpOnly session cookie for an internal platform-account browser session.
    workerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Independent Media Worker service identity accepted only by internal media job endpoints.
        Outside local/test it is a signed JWT with HTTPS issuer/JWK Set, a non-empty subject,
        bounded validity and exactly the configured Media Worker audience. Local/test retains a
        distinct synthetic static bearer for isolated development only.
    exportWorkerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Independent Export Worker service identity accepted only by internal dataset export
        endpoints. Outside local/test it is a signed JWT with HTTPS issuer/JWK Set, a non-empty
        subject, bounded validity and exactly the configured Export Worker audience. Its audience
        must differ from Media Worker; local/test retains a distinct synthetic static bearer only.
    aiWorkerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Independent AI Worker service identity accepted only by internal AI candidate job endpoints.
        Outside local/test it is a signed JWT with its own exact audience; local/test retains a
        distinct synthetic static bearer only.
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The caller is not authorized for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested resource is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
  headers:
    NoStore:
      description: Prevents clients and intermediaries from retaining authorization-sensitive data.
      schema:
        type: string
        const: no-store
  schemas:
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    ProjectRenameRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
    PlatformSession:
      type: object
      additionalProperties: false
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/PlatformAccountRole"
    PlatformAccountRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    PlatformAccountCreateRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
    PlatformAccountEnabledRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    PlatformAccount:
      type: object
      additionalProperties: false
      required:
        - username
        - role
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
        role:
          $ref: "#/components/schemas/PlatformAccountRole"
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformAccountList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAccount"
    ProjectRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    ProjectStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    MembershipStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
    Project:
      type: object
      additionalProperties: false
      required:
        - project_id
        - display_name
        - status
        - current_role
        - created_at
      properties:
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: "#/components/schemas/ProjectStatus"
        current_role:
          $ref: "#/components/schemas/ProjectRole"
        created_at:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - items
        - can_create_projects
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        can_create_projects:
          type: boolean
          description: True only when the authenticated identity has provisioning administrator authority.
    ProjectMembershipRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectMembership:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - project_id
        - actor_id
        - role
        - status
        - version
        - updated_at
      properties:
        membership_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        actor_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    ProjectMembershipList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
    AssetFolderRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1F\x7F]+$
    AssetFolder:
      type: object
      additionalProperties: false
      required:
        - folder_id
        - project_id
        - display_name
        - version
        - created_at
        - updated_at
      properties:
        folder_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssetFolderList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetFolder"
    ClipAssetFolderRequest:
      type: object
      additionalProperties: false
      required:
        - folder_id
      properties:
        folder_id:
          type: string
          format: uuid
    ClipAssetFolder:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - project_id
        - version
        - updated_at
      properties:
        clip_asset_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          description: Omitted when the ClipAsset is in the unclassified project view.
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    UploadBatchInitRequest:
      type: object
      additionalProperties: false
      required:
        - project_id
        - device_id
        - file_count
        - total_size_bytes
        - manifest_sha256
      properties:
        project_id:
          type: string
          format: uuid
          description: Project that owns the batch; authorization enforcement is handled separately.
        device_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: >-
            Stable non-personal identifier of the uploading edge device. PLATFORM_LOCAL is required
            when upload_source_type is PLATFORM_LOCAL.
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
          default: HOSPITAL_REMOTE
          description: Immutable upload-entry provenance. Omitted requests remain HOSPITAL_REMOTE for compatibility.
        asset_folder_id:
          type: [string, "null"]
          format: uuid
          description: Optional project folder for a PLATFORM_LOCAL video; never an object-storage path or permission boundary.
        file_count:
          type: integer
          format: int32
          minimum: 1
          description: Number of files declared by the immutable batch manifest.
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Sum of declared file sizes; large values including files over 2GB are supported.
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: >-
            SHA-256 of upload-file-manifest-v1. Encode UTF-8 text beginning with
            `upload-file-manifest-v1\n`; sort entries by lowercase client_file_id; append one line
            per file as `client_file_id<TAB>file_kind<TAB>content_type<TAB>size_bytes<TAB>sha256<TAB>part_size_bytes\n`.
            Excludes credentials, signed URLs, storage upload IDs and server-assigned IDs.
        external_manifest_id:
          type: [string, "null"]
          format: uuid
          description: Persisted explicit external camera manifest to bind to this upload batch.
    UploadBatch:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - device_id
        - upload_source_type
        - file_count
        - total_size_bytes
        - manifest_sha256
        - status
        - expires_at
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        device_id:
          type: string
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
        asset_folder_id:
          type: [string, "null"]
          format: uuid
        external_manifest_id:
          type: [string, "null"]
          format: uuid
        file_count:
          type: integer
          format: int32
        total_size_bytes:
          type: integer
          format: int64
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          $ref: "#/components/schemas/UploadBatchStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UploadSourceType:
      type: string
      enum:
        - HOSPITAL_REMOTE
        - PLATFORM_LOCAL
    UploadBatchStatus:
      type: string
      enum:
        - INITIATED
        - UPLOADING
        - COMPLETING
        - COMPLETED
        - FAILED
        - ABORTED
        - EXPIRED
    UploadCleanupStatus:
      type: string
      enum:
        - NOT_REQUIRED
        - PENDING
        - IN_PROGRESS
        - SUCCEEDED
        - FAILED
      description: >-
        Durable cleanup projection. FAILED means the bounded retry limit was reached and requires
        operator intervention; it never changes the already committed batch terminal state.
    UploadBatchTermination:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - status
        - termination_reason_code
        - terminated_at
        - cleanup_status
        - cleanup_task_count
        - completed_cleanup_task_count
        - failed_cleanup_task_count
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ABORTED
            - EXPIRED
        termination_reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        terminated_at:
          type: string
          format: date-time
        cleanup_status:
          $ref: "#/components/schemas/UploadCleanupStatus"
        cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        completed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        failed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
    UploadBatchCompletion:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - status
        - file_count
        - total_size_bytes
        - manifest_sha256
        - verified_manifest_sha256
        - clip_asset_count
        - clip_assets
        - completed_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        status:
          type: string
          const: COMPLETED
        file_count:
          type: integer
          format: int32
          minimum: 1
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        verified_manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        clip_asset_count:
          type: integer
          format: int32
          minimum: 1
        clip_assets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClipAssetBinding"
        completed_at:
          type: string
          format: date-time
    ClipAssetBinding:
      type: object
      additionalProperties: false
      required:
        - clip_asset_id
        - source_upload_file_id
        - client_file_id
        - content_type
        - size_bytes
        - sha256
        - status
      properties:
        clip_asset_id:
          type: string
          format: uuid
        source_upload_file_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        content_type:
          type: string
          minLength: 3
          maxLength: 128
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          const: UPLOADED
    UploadBatchProgress:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - project_id
        - device_id
        - upload_source_type
        - file_count
        - registered_file_count
        - uploaded_file_count
        - failed_file_count
        - total_size_bytes
        - uploaded_size_bytes
        - tracked_part_count
        - uploaded_part_count
        - status
        - cleanup_status
        - cleanup_task_count
        - completed_cleanup_task_count
        - failed_cleanup_task_count
        - terminated_at
        - termination_reason_code
        - expires_at
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        device_id:
          type: string
        upload_source_type:
          $ref: "#/components/schemas/UploadSourceType"
        asset_folder_id:
          type: [string, "null"]
          format: uuid
        external_manifest_id:
          type: [string, "null"]
          format: uuid
        file_count:
          type: integer
          format: int32
          minimum: 1
          description: File count declared by the immutable batch manifest.
        registered_file_count:
          type: integer
          format: int32
          minimum: 0
          description: File manifest entries currently registered in the platform.
        uploaded_file_count:
          type: integer
          format: int32
          minimum: 0
          description: Files that passed Multipart Complete, final size and full-file SHA-256 checks.
        failed_file_count:
          type: integer
          format: int32
          minimum: 0
        total_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Total bytes declared by the immutable batch manifest.
        uploaded_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Sum of storage-backed, platform-confirmed Part bytes.
        tracked_part_count:
          type: integer
          format: int64
          minimum: 0
        uploaded_part_count:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/UploadBatchStatus"
        cleanup_status:
          $ref: "#/components/schemas/UploadCleanupStatus"
        cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        completed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        failed_cleanup_task_count:
          type: integer
          format: int32
          minimum: 0
        terminated_at:
          type:
            - string
            - "null"
          format: date-time
        termination_reason_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UploadFileRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - file_kind
        - content_type
        - size_bytes
        - sha256
        - part_size_bytes
      properties:
        file_kind:
          $ref: "#/components/schemas/UploadFileKind"
        content_type:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*/[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*$
          description: Media type only; parameters and source file paths are not accepted.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        part_size_bytes:
          type: integer
          format: int64
          minimum: 8388608
          maximum: 67108864
          description: Planned part size from 8 MiB through 64 MiB; the last part may be smaller.
        file_name:
          type: [string, "null"]
          maxLength: 255
          description: Original client filename. Required for a video bound to an external ingest manifest.
    UploadFile:
      type: object
      additionalProperties: false
      required:
        - upload_file_id
        - batch_id
        - client_file_id
        - file_kind
        - content_type
        - size_bytes
        - sha256
        - part_size_bytes
        - total_parts
        - status
        - created_at
      properties:
        upload_file_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        client_file_id:
          type: string
          format: uuid
        file_name:
          type: [string, "null"]
          maxLength: 255
        file_kind:
          $ref: "#/components/schemas/UploadFileKind"
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        part_size_bytes:
          type: integer
          format: int64
        total_parts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000

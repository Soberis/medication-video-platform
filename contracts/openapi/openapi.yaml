  /projects/{project_id}/dataset-versions/{dataset_version_id}/exports:
    post:
      operationId: requestDatasetExport
      tags:
        - Dataset Admission
      summary: Request the approved P0 export profile for a frozen dataset version
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership and a FROZEN DatasetVersion. Creates exactly one REQUESTED
        DatasetExport bound to the immutable build specification, relational snapshot, PASS
        validation and its approved v1 or v2 export profile, together with a pending administrator
        approval request and audit event. P0 accepts only MODEL_TRAINING and an explicit future
        expiry. This command does not approve, queue, generate, publish or authorize download of
        any file. Replaying the same idempotency key and request returns the original record.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetExportCreateRequest"
      responses:
        "201":
          description: The immutable export request and pending approval were recorded.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExport"
        "400":
          description: The path, required headers, purpose or expiry syntax is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not an ACTIVE project administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project or DatasetVersion is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: >-
            The DatasetVersion is not FROZEN, its approved evidence is inconsistent, the expiry is
            not in the future, an export request already exists, or the idempotency key conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/exports/approval-readiness:
    get:
      operationId: getDatasetExportApprovalReadiness
      tags:
        - Dataset Admission
      summary: Check whether a frozen export request is ready for administrator approval
      description: >-
        Requires ACTIVE project membership. Re-evaluates whether the current actor is global ROLE_ADMIN
        with ACTIVE project ADMIN membership, purpose expiry, DatasetVersion FROZEN state, immutable export bindings and all
        current freeze-evidence checks. The response is a read-only point-in-time preflight: it does
        not approve the request, create an approval decision, queue a job, start a Worker or create
        export files. A future approval command must repeat these checks transactionally.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
      responses:
        "200":
          description: Point-in-time export approval readiness and stable blocking reasons.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExportApprovalReadiness"
        "400":
          description: A path parameter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project, DatasetVersion or export request is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
  /projects/{project_id}/dataset-versions/{dataset_version_id}/exports/approvals:
    post:
      operationId: approveDatasetExport
      tags:
        - Dataset Admission
      summary: Approve and queue the current v2 dataset export
      description: >-
        Requires global ROLE_ADMIN plus ACTIVE project ADMIN membership. The same administrator may
        approve their own request and the audit records SELF_ADMIN_APPROVAL. Repeats all readiness
        checks in one transaction, records the immutable approval decision, moves the export to
        QUEUED, creates attempt 1 and writes dataset-export-job.v1 to the Transactional Outbox.
        It does not run packaging synchronously. The same Idempotency-Key and command replay the
        original result; another command using that key is rejected.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "202":
          description: Approval, first attempt and Outbox dispatch were recorded atomically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExport"
        "400":
          description: A path or required header is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "403":
          description: The actor is not a global administrator with ACTIVE project ADMIN membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "404":
          description: The project, DatasetVersion or export request is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"
        "409":
          description: The request is no longer ready, executable or pending, or idempotency conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetVersionError"

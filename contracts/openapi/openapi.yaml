          format: uuid
        project_id:
          type: string
          format: uuid
        annotation_task_id:
          type: string
          format: uuid
        clip_asset_id:
          type: string
          format: uuid
        revision_number:
          type: integer
          minimum: 1
        annotation_schema_version:
          type: string

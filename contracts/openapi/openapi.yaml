openapi: 3.1.0
info:
  title: Medication Video Platform API
  version: 0.54.0
  description: >-
    P0 contract for the medication video data platform. Active capabilities create data projects,
    authenticate internal platform accounts with an HttpOnly session, manage project memberships,
    initialize verified uploads, assemble CaptureSession/CameraSet/CameraStream facts, expose
    CaptureGroup workflows with ClipAsset evidence detail, run Media Probe and MediaPipe hand candidates,
    record human quality, annotation, Review and event-level CaptureGroup Cleaning facts, and synchronously
    preview and download current MediaPipe hand-landmark evidence from authoritative read-only
    projections. The API never proxies upload bytes through the
    Core API, exposes storage locations through catalog reads, controls or probes edge hardware,
    or performs media processing synchronously inside a user request.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: Version 1 API prefix
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Authentication
    description: >-
      Internal platform-account password login, session inspection and logout. Hospital edge devices
      do not use these endpoints; they retain their service credentials for automated uploads.
  - name: Platform Accounts
    description: >-
      Internal account directory. Only a global ADMIN may create MEMBER accounts, list accounts or
      enable and disable MEMBER accounts. This directory never exposes password hashes.
  - name: Projects
    description: >-
      Data-project and ADMIN/MEMBER membership lifecycle owned by the iamproject module. Administrators
      may rename an ACTIVE project or archive it without physically deleting its data; membership
      changes are project-scoped, administrator-controlled, idempotent and append-only audited.
  - name: Uploads
    description: >-
      Upload batch lifecycle owned by the assetcapture module. Every command and read requires an
      ACTIVE membership in the owning project; a batch outside that scope is hidden as
      UPLOAD_BATCH_NOT_FOUND.
  - name: Quality Review
    description: >-
      Project-member human decisions about whether an INGESTED ClipAsset is suitable for annotation
      and training. The current fact is versioned and every change is append-only audited.
  - name: Annotation Tasks
    description: >-
      Project-scoped human annotation queue containing exactly one task per admitted CaptureGroup.
      Members can read only tasks assigned to themselves; ClipAsset remains evidence inside the group.
  - name: Camera Configuration
    description: >-
      Administrative server-side camera identities and immutable set versions. These resources are
      provisioned to an edge device; they do not connect to, control or trigger RK3588 hardware.
  - name: Asset Catalog
    description: Project-scoped read models for nurse medication-preparation sessions and video assets.
  - name: Hand Landmark Export
    description: >-
      Explicit, synchronous, read-only current MediaPipe hand-landmark evidence export. It never imports
      human annotation, Review or Cleaning decisions and preserves the current administrator and
      synthetic-data security boundary.
  - name: Human Annotation Export
    description: >-
      Explicit, synchronous, read-only export of current-input human action annotations that have completed
      review approval. It is separate from MediaPipe machine evidence and contains no MP4 bytes.
  - name: Video Playback
    description: >-
      Explicit, short-lived raw-video access for an internal account with ACTIVE project membership.
      It is for human review, not download, annotation or a privacy-release decision.
  - name: Media Jobs
    description: >-
      Project-scoped media probe job lifecycle owned by the mediaprivacy module. Creation freezes
      the input and approved recipe, persists attempt 1 and a versioned dispatch envelope through
      the Transactional Outbox, and returns QUEUED. RabbitMQ is a delivery mechanism rather than
      the business state store; successful completion requires a lease-matched, approved Worker
      result to be validated and committed by the Core API.
paths:
  /projects/{project_id}/human-annotations/v1/download:
    get:
      operationId: downloadHumanAnnotationTrainingData
      tags:
        - Human Annotation Export
      summary: Download approved human action annotations as CSV
      description: >-
        Returns one row per segment from the latest AnnotationRevision for each current CaptureGroup in the project,
        or the requested CaptureGroup. Only COMPLETED tasks with APPROVED AnnotationReview and current input/media
        provenance are exported. The CSV contains labels and provenance, no MP4 bytes and no MediaPipe landmark fields.
        It is restricted to the synthetic data profile until a non-synthetic authorization model is defined.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: query
          required: false
          description: Limits the export to exactly one CaptureGroup belonging to the project.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved human annotation CSV; no MP4 bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Content-Disposition:
              schema:
                type: string
                pattern: '^attachment; filename="human_annotations_v1_(project|event_[a-f0-9]{8})_[0-9]{8}T[0-9]{6}Z\\.csv"$'
          content:
            "text/csv; charset=UTF-8":
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            No current approved annotation is ready, or current annotation/media provenance cannot be proven safely.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/hand-landmarks/v1/preview:
    get:
      operationId: getHandLandmarkTrainingExportPreview
      tags:
        - Hand Landmark Export
      summary: Preview current MediaPipe hand-landmark detection samples
      description: >-
        Requires a global ROLE_ADMIN and an ACTIVE ADMIN membership. The preview enumerates current enabled
        and available camera streams for every current CaptureGroup, or exactly the requested CaptureGroup,
        and reads the current MediaPipe job and CandidateAnnotation evidence for each ClipAsset. It has no dependency on View or Group Quality,
        AnnotationRevision, Review, Cleaning or any human eligibility decision. Only a current
        SUCCEEDED_WITH_CANDIDATES job contributes rows; NO_JOB, QUEUED, RUNNING, FAILED and
        SUCCEEDED_NO_HAND views contribute no rows and are represented by the corresponding detection-state
        counts (`no_job_view_count`, `queued_view_count`, `running_view_count`, `failed_view_count` and
        `no_hand_view_count`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: query
          required: false
          description: Limits the export to exactly one CaptureGroup belonging to the project.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current MediaPipe hand-landmark detection export preview.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandLandmarkTrainingExportPreview"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            Current CaptureGroup view, frozen AI evidence or selected CandidateAnnotation data cannot be
            proven safely.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/hand-landmarks/v1/download:
    get:
      operationId: downloadHandLandmarkTrainingData
      tags:
        - Hand Landmark Export
      summary: Download current MediaPipe hand-landmark detection samples as CSV
      description: >-
        Returns one row per valid 21-point MediaPipe hand candidate from the current
        SUCCEEDED_WITH_CANDIDATES job for every current enabled and available camera stream in the project
        or requested CaptureGroup. The export
        preserves each ClipAsset's source-local frame timestamp and camera stream identity; it does not
        select a Primary View or align timestamps across cameras, and contains no human labels, annotation,
        Review or Cleaning fields. The response contains no MP4 bytes and is restricted to the synthetic
        data profile until a non-synthetic authorization model is defined. CSV columns are emitted in this
        exact order: capture_group_id, camera_stream_id, camera_number, clip_asset_id, clip_asset_sha256,
        candidate_annotation_id, frame_timestamp_ms, hand_index, handedness, handedness_score, image_width,
        image_height, valid_landmark_count, bounding_box_x, bounding_box_y, bounding_box_width,
        bounding_box_height, landmark_00_x, landmark_00_y, landmark_00_z through landmark_20_x,
        landmark_20_y, landmark_20_z, ai_job_id, ai_job_attempt_id, attempt, algorithm_key,
        algorithm_version, model_sha256, profile_sha256, input_sha256, result_sha256.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capture_group_id
          in: query
          required: false
          description: Limits the export to exactly one CaptureGroup belonging to the project.
          schema:
            type: string
            format: uuid
        - name: generated_at
          in: query
          required: false
          description: The generated_at value returned by preview, preserving its advertised filename.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Deterministic current MediaPipe hand-landmark detection CSV; no MP4 bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Content-Disposition:
              schema:
                type: string
                pattern: '^attachment; filename="mediapipe_hand_landmarks_v1_(project|event_[a-f0-9]{8})_[0-9]{8}T[0-9]{6}Z\\.csv"$'
          content:
            "text/csv; charset=UTF-8":
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            Current CaptureGroup camera-stream or MediaPipe candidate evidence cannot be proven safely,
            including a missing or changed current ClipAsset, a source digest mismatch, or malformed
            candidate provenance.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: loginPlatformAccount
      tags:
        - Authentication
      summary: Start an internal platform-account session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Authenticated session. The response sets the XSRF-TOKEN Cookie used for subsequent browser commands.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
        "400":
          description: Login request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The username or password is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/session:
    get:
      operationId: getPlatformSession
      tags:
        - Authentication
      summary: Read the current internal platform-account session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
        "401":
          description: No authenticated session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutPlatformAccount
      tags:
        - Authentication
      summary: End the current internal platform-account session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session ended.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          description: No authenticated session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/accounts:
    get:
      operationId: listPlatformAccounts
      tags:
        - Platform Accounts
      summary: List internal platform accounts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account directory without credentials.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccountList"
        "401":
          description: No authenticated session exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Global administrator authority is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPlatformAccount
      tags:
        - Platform Accounts
      summary: Create an internal MEMBER account
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAccountCreateRequest"
      responses:
        "201":
          description: New enabled MEMBER account.
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccount"
        "400":
          description: The account request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Global administrator authority is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The username is already in use.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/accounts/{username}/enabled:
    patch:
      operationId: changePlatformAccountEnabled
      tags:
        - Platform Accounts
      summary: Enable or disable an internal MEMBER account
      security:
        - sessionCookie: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:@-]{2,127}$
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAccountEnabledRequest"
      responses:
        "200":
          description: Account state after the command.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccount"
        "400":
          description: The account request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Global administrator authority is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The account does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The bootstrap administrator is immutable through this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects:
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Create a data project
      description: >-
        Creates an ACTIVE project and grants the authenticated provisioning administrator its first
        ADMIN membership in one transaction. Reusing the Idempotency-Key with the same request
        returns the original project; different content returns a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Project created, or the original project returned for an idempotent replay.
          headers:
            Location:
              description: Canonical project resource path.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Request, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provisioning administrator authority is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The idempotency key was already used with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: List projects visible to the authenticated member
      description: >-
        Returns only ACTIVE projects with an ACTIVE membership for the authenticated actor, plus the
        server-evaluated capability to create a project.
      responses:
        "200":
          description: Authorized projects, ordered deterministically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}:
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Read an authorized project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Authorized project and the caller's current role.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The project identifier is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: renameProject
      tags:
        - Projects
      summary: Rename an active data project
      description: >-
        Requires an ACTIVE ADMIN membership. Changes only the display name; project ID, memberships,
        folders, videos and audit history are unchanged. Repeating the same desired name has no
        additional business side effect.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRenameRequest"
      responses:
        "200":
          description: Renamed active project.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Request or project identifier validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist, is archived, or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveProject
      tags:
        - Projects
      summary: Archive a data project without physically deleting its data
      description: >-
        Requires an ACTIVE ADMIN membership. ARCHIVED projects disappear from normal project lists
        and reject future project-scoped access. This command retains project, membership, video,
        object-storage and audit records; P0 has no project hard-delete endpoint.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "204":
          description: Project archived, or it was already archived.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: Project identifier validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist or is not visible to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/memberships:
    get:
      operationId: listProjectMemberships
      tags:
        - Projects
      summary: List project memberships
      description: Requires an ACTIVE ADMIN membership in the project.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: ACTIVE membership records ordered deterministically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipList"
        "400":
          description: The project identifier is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/memberships/{actor_id}:
    put:
      operationId: upsertProjectMembership
      tags:
        - Projects
      summary: Grant, reactivate or change a project membership
      description: >-
        Requires an ACTIVE ADMIN membership. The command is idempotent per project, administrator
        and Idempotency-Key. Demoting the final ACTIVE administrator is rejected.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipRequest"
      responses:
        "200":
          description: Membership state after the command, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          description: Request, path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An ACTIVE ADMIN membership is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The idempotency key conflicts with another command, or the command would remove the
            final ACTIVE administrator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeProjectMembership
      tags:
        - Projects
      summary: Remove a project membership
      description: >-
        Requires an ACTIVE ADMIN membership. Removal preserves the membership record and audit
        history. Removing the final ACTIVE administrator is rejected.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalRequestId"
      responses:
        "200":
          description: Removed membership state, including an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          description: Path, request ID or idempotency key validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":

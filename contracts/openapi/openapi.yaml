  /upload/{batch_id}/files/{client_file_id}/multipart:
    put:
      operationId: startMultipartUpload
      tags:
        - Uploads
      summary: Create the file's object-storage multipart session
      description: >-
        Creates at most one S3-compatible multipart session for a registered file. Every file and
        byte declared by the batch manifest must already be registered. This natural-resource PUT
        is replay-safe, does not expose the storage upload ID, does not issue upload credentials and
        leaves the batch in INITIATED until a part authorization is successfully issued.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Multipart session created or the existing session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMultipartSession"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The manifest is incomplete, expired or not in an uploadable state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not create the multipart session; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/completion:
    put:
      operationId: completeUploadFile
      tags:
        - Uploads
      summary: Complete and verify one multipart file
      description: >-
        Acquires a bounded completion lease, reads the authoritative current Part list from object
        storage, requires continuous Part numbers and exact manifest size, and submits those current
        ETags to S3 CompleteMultipartUpload. It then inspects and streams the completed object to
        calculate the full-file SHA-256. A multipart ETag is never treated as a SHA-256. Identical
        replays return the persisted result, and a retry can recover when object storage completed
        before the platform persisted success.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File completed and final object integrity verified, or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileCompletion"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Parts are incomplete or divergent, another completion lease is active, or final size or
            SHA-256 verification failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not list, complete, inspect or stream the object; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/{part_number}/authorization:
    post:
      operationId: authorizeUploadPart
      tags:
        - Uploads
      summary: Authorize a direct upload of one immutable part
      description: >-
        Registers the expected SHA-256 for a part and returns a short-lived pre-signed PUT URL.
        Repeating the same part and hash reissues a fresh authorization; changing the hash returns
        a conflict. The response is a temporary credential, must not be logged or persisted by the
        caller, and is returned with Cache-Control: no-store. The first successful authorization
        moves the file and batch to UPLOADING.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPartAuthorizationRequest"
      responses:
        "200":
          description: A fresh direct-upload authorization was issued.
          headers:
            Cache-Control:
              description: Prevents storage of the temporary credential response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartAuthorization"
        "400":
          description: Path or checksum validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The session is missing, the part is out of range or immutable metadata conflicts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not sign the part authorization; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/{part_number}/confirmation:
    put:
      operationId: confirmUploadPart
      tags:
        - Uploads
      summary: Confirm one part from object-storage state
      description: >-
        Queries object storage for the authorized part and records it as UPLOADED only when the
        stored part number and byte length match the immutable manifest. The caller does not submit
        an ETag, so client-controlled metadata cannot confirm missing bytes. An identical replay is
        safe. The declared part SHA-256 is not treated as independently verified until final file
        integrity verification.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: part_number
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
      responses:
        "200":
          description: The storage-backed part was confirmed or returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedUploadPart"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The part was not authorized, is missing from storage, has the wrong size or conflicts
            with a prior confirmation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not inspect the part; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts:
    get:
      operationId: getUploadPartProgress
      tags:
        - Uploads
      summary: Read persisted multipart progress
      description: >-
        Returns the current platform record for authorized and confirmed parts without issuing
        credentials or changing upload state. After an interrupted client reconnects, it should
        reconcile storage state first and then use this representation to decide which parts still
        need authorization and upload.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current persisted multipart progress.
          headers:
            Cache-Control:
              description: Prevents a resume client from using stale progress.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartProgressList"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The file has not entered multipart upload.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/{batch_id}/files/{client_file_id}/parts/reconciliation:
    put:
      operationId: reconcileUploadParts
      tags:
        - Uploads
      summary: Reconcile persisted progress with object storage
      description: >-
        Idempotently lists the multipart upload in object storage and confirms every tracked part
        whose stored byte length matches the immutable manifest. This explicit command recovers
        parts uploaded before a client interruption without giving a state-changing side effect to
        the GET progress endpoint. Unknown, missing previously confirmed or size-mismatched parts
        produce a conflict instead of being silently accepted.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Storage and persisted progress are reconciled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartProgressList"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The batch or file does not exist in the authenticated project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Platform progress and object-storage state diverged.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Object storage could not list the parts; retry may succeed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/camera-channels/{provisioning_key}:
    put:
      operationId: provisionCameraChannel
      tags:
        - Camera Configuration
      summary: Provision a stable logical camera channel
      description: >-
        Requires an ACTIVE ADMIN membership. This administrative or deployment-time operation maps
        a project-scoped, non-secret
        provisioning key to an immutable platform CameraChannel ID. Repeating the same natural-key
        PUT returns the original resource. The provisioning key is a technical integration key,
        not a user-facing alias or hardware credential. This operation does not contact or control
        an RK3588 device or camera.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: provisioning_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      responses:
        "201":
          description: Channel provisioned, or the existing resource returned idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of project configuration responses.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraChannel"
        "400":
          description: Path validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is an ACTIVE project MEMBER but not an ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist in the caller's ACTIVE membership scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/camera-sets/{camera_set_key}/versions/{configuration_version}:
    put:
      operationId: configureCameraSetVersion
      tags:
        - Camera Configuration
      summary: Create an immutable CameraSet configuration version
      description: >-
        Requires an ACTIVE ADMIN membership. This administrative or deployment-time operation
        creates an immutable, project-scoped
        CameraSet version from previously provisioned logical channels. Member order in the request
        is insignificant; camera_index defines canonical order. Repeating the same natural-key PUT
        with equivalent content returns the original resource, while changed content for an existing
        version is rejected. At least one member must be enabled, and channel IDs and indices must be
        unique. The resulting camera_set_id is provisioned to the RK3588 integration for later
        CaptureSession ingest; this operation does not test camera connectivity or trigger capture.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: camera_set_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        - name: configuration_version
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraSetRequest"
      responses:
        "201":
          description: CameraSet version created, or the equivalent existing version returned idempotently.
          headers:
            Cache-Control:
              description: Prevents storage of project configuration responses.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSet"
        "400":
          description: Path or request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid bearer token was not provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller is an ACTIVE project MEMBER but not an ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The project does not exist in the caller's ACTIVE membership scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            A referenced channel is outside the project, a member invariant failed, or the immutable
            version already exists with different content.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/external-video-ingest-manifests:
    post:
      operationId: acceptExternalVideoIngestManifestV1
      tags:
        - External Ingest
      summary: Validate an explicit external video ingest manifest
      description: >-
        Validates the versioned external manifest and its explicit capture-group/camera-number
        identity. expected_camera_numbers is the theoretical fixed-camera set; videos is the
        actual declared set for this Capture. The platform never derives a group or camera identity
        from filenames, upload order or timestamps; file bytes continue through the existing upload flow.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/external-video-ingest-v1.schema.json" }
      responses:
        "202":
          description: Manifest metadata passed validation.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalVideoIngestManifestAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{project_id}/capture-sessions:
    get:
      operationId: listCaptureSessions
      tags:
        - Asset Catalog
      summary: List medication-preparation capture sessions in one authorized project
      description: >-
        Returns a bounded keyset page ordered by device_time_utc when available, otherwise
        server_receive_time, then capture_session_id descending.
        bound_stream_count means a ClipAsset is associated with a CameraStream; received_camera_count
        only counts media that reached INGESTED. The authenticated actor must hold an ACTIVE
        Membership in the explicit project path.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: device_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        - name: assembly_status
          in: query
          schema:
            $ref: "#/components/schemas/CaptureSessionAssemblyStatus"
        - name: quality_status
          in: query
          schema:
            $ref: "#/components/schemas/CaptureQualityStatus"
        - name: recorded_from
          in: query
          description: Inclusive lower bound on device_time_utc.
          schema:
            type: string
            format: date-time
        - name: recorded_before
          in: query
          description: Exclusive upper bound on device_time_utc.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding CaptureSession page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Project-scoped page of capture sessions.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSessionList"
        "400":
          description: Invalid filter, time range, limit or cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated principal cannot be used for project-scoped reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The requested project does not exist, is inactive or is not visible to the actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{project_id}/capture-sessions/{capture_session_id}:

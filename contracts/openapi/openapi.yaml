        - source_message_id
        - source_attempt
        - dead_letter_reason
        - body_sha256
        - operator_reason_code
        - change_reference
      properties:
        dead_letter_id:
          type: string
          format: uuid
          description: Deterministic UUIDv5 from the dataset export diagnostic reason and body digest.
        source_message_id:
          type: string
          format: uuid
        source_attempt:
          type: integer
          minimum: 1
        dead_letter_reason:
          type: string
          enum:
            - DATASET_EXPORT_JOB_CONTRACT_INVALID
            - DATASET_EXPORT_JOB_PROFILE_UNSUPPORTED
            - DATASET_EXPORT_JOB_ACQUIRE_REJECTED
            - DATASET_EXPORT_JOB_LEASE_REJECTED
            - DATASET_EXPORT_JOB_RESULT_REJECTED
          description: Stable reason from dataset-export-dead-letter.v1; contract-invalid is rejected as unreplayable.
        body_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 from the sanitized diagnostic, never the original message body.
        operator_reason_code:
          type: string
          enum:
            - CONFIGURATION_FIXED
            - WORKER_DEPLOYMENT_FIXED
            - AUTHORIZATION_FIXED
            - OTHER_APPROVED
        change_reference:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]{2,127}$
          description: Non-sensitive ticket, deployment or commit reference supporting the replay.

      description: >-
        Internal Worker endpoint. The service identity, opaque lease capability, current attempt,
        worker ID and unexpired lease must all match. A successful heartbeat sets lease_until to
        the current server time plus the configured lease duration; it never revives an expired or
        lost attempt and never accumulates lease time from the previous deadline.

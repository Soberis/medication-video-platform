        input_version:
          type: [string, "null"]
          maxLength: 128
        confirmed_view_set_sha256:
          type: [string, "null"]
          pattern: ^[a-f0-9]{64}$
    CaptureGroupQualityReviewHistory:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaptureGroupQualityReview"
    CaptureGroupQualityReviewBatch:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CaptureGroupQualityReview"
    ExternalVideoIngestManifestAccepted:
      type: object
      additionalProperties: false
      required:
        - manifest_id
        - status
        - schema_version
        - capture_group_key
        - key_source
        - captured_at
        - expected_camera_count
        - video_count
      properties:
        manifest_id: { type: string, format: uuid }
        status:
          type: string
          enum: [ACCEPTED, BOUND]
          description: >-
            ACCEPTED means the explicit manifest is persisted but not bound. BOUND means it is
            uniquely bound to one UploadBatch; it does not mean that CaptureSession assembly or
            media ingestion is complete.
        schema_version: { type: string, const: external-video-ingest-v1 }
        capture_group_key: { type: string, minLength: 1, maxLength: 128 }
        key_source:
          type: string
          enum: [EXTERNAL_CAPTURE_SESSION_ID, UPSTREAM_MANIFEST_KEY]
        captured_at: { type: string, format: date-time }
        expected_camera_count: { type: integer, minimum: 1, maximum: 64 }
        video_count: { type: integer, minimum: 1, maximum: 64 }
    ExternalVideoIngestManifestV2Accepted:
      type: object
      additionalProperties: false
      required:
        - manifest_id
        - status
        - schema_version
        - capture_group_key
        - key_source
        - captured_at
        - expected_camera_numbers
        - received_camera_numbers
        - missing_camera_numbers
        - upload_set_finalized
        - receipt_state
        - video_count
        - received_video_count
      properties:
        manifest_id: { type: string, format: uuid }
        status:
          type: string
          enum: [ACCEPTED, BOUND]
          description: Manifest persistence/binding status; it is independent of receipt state.
        schema_version: { type: string, const: external-video-ingest-v2 }
        capture_group_key: { type: string, minLength: 1, maxLength: 128 }
        key_source:
          type: string
          enum: [EXTERNAL_CAPTURE_SESSION_ID, UPSTREAM_MANIFEST_KEY]
        captured_at: { type: string, format: date-time }
        expected_camera_numbers:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
        received_camera_numbers:
          type: array
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
        missing_camera_numbers:
          type: array
          maxItems: 64
          items: { type: integer, minimum: 1, maximum: 64 }
        upload_set_finalized:
          type: boolean
          description: Explicit close fact; it is only accepted after an upload-backed CaptureSession exists.
        receipt_state:
          $ref: "#/components/schemas/CaptureGroupReceiptState"
        video_count:
          type: integer
          minimum: 0
          maximum: 64
          description: Number of declared manifest video rows; declarations are upload intent, not receipt.
        received_video_count:
          type: integer
          minimum: 0
          maximum: 64
          description: Number of actual bound ClipAsset/CameraStream video facts used by receipt calculation.
    ClipAssetRead:

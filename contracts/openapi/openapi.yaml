        - reviewer_actor_id
        - revision
        - version
        - decided_at
        - confirmed_view_set
        - input_version
        - confirmed_view_set_sha256
      properties:
        capture_group_quality_review_id:
          type: [string, "null"]
          format: uuid
        project_id:
          type: string
          format: uuid
        capture_group_id:
          type: string
          format: uuid
        result:
          type: string
          enum:
            - UNREVIEWED
            - QUALIFIED
            - QUALIFIED_WITH_EXCLUSIONS
            - NEEDS_REVIEW
            - REJECTED
        reason:
          type: [string, "null"]
          maxLength: 1000
        reviewer_actor_id:
          type: [string, "null"]
          maxLength: 128
        revision:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        decided_at:
          type: [string, "null"]
          format: date-time
        confirmed_view_set:
          anyOf:
            - $ref: "#/components/schemas/CaptureGroupViewSet"

[project]
name = "golden-capture-g0"
version = "0.1.0"
description = "Synthetic-only V1.19 Golden Capture and Parquet design validation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow==21.0.0",
    "tzdata==2025.2",
]

[project.scripts]
golden-capture-g0 = "golden_capture_g0.experiment:main"

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_capture_g0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

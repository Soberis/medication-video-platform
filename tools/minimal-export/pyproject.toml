[project]
name = "medication-platform-minimal-export"
version = "0.1.0"
description = "Minimal read-only Cleaning PASS training-data Parquet export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=18,<23",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["export_training_data.py", "tests"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pyarrow", "psycopg"]
ignore_missing_imports = true

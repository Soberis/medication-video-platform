name: ${COMPOSE_PROJECT_NAME:-medication-video-platform}

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:7cfd7f5e307dbd8cf5d88761b22934c042a749362c0ab7efc41805572d58b3a3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medication_platform}
      POSTGRES_USER: ${POSTGRES_USER:-medication_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  s3:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-change-me-local-only}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-local-only}
      S3_BUCKET: ${S3_BUCKET:-medication-platform-local}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://localhost:9333/cluster/status
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.2-management@sha256:c1e33461287f4c53049ce525575f0df77b2a00a88e2593776afbb6c1489bdb81
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medication_local}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-local-only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-medication}
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
  s3-data:
  rabbitmq-data:

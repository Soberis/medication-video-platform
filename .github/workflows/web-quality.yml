name: Web quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run web:format:check

      - name: Lint
        run: pnpm run web:lint

      - name: Type check
        run: pnpm run web:type-check

      - name: Unit tests
        run: pnpm run web:test

      - name: Build
        run: pnpm run web:build

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright + axe
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$BASE_URL/login" > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent --show-error "$BASE_URL/login" > /dev/null; then
            cat "$RUNNER_TEMP/web-preview.log"
            exit 1
          fi

          pnpm exec node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          import { AxeBuilder } from '@axe-core/playwright'

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            locale: 'zh-CN',
            timezoneId: 'Asia/Shanghai',
            colorScheme: 'light',
            reducedMotion: 'reduce',
          })

          try {
            const page = await context.newPage()
            await page.route('**/api/v1/auth/session', (route) =>
              route.fulfill({
                status: 401,
                contentType: 'application/problem+json',
                body: JSON.stringify({ error_code: 'UNAUTHENTICATED' }),
              }),
            )
            await page.goto(`${process.env.BASE_URL}/login`, { waitUntil: 'domcontentloaded' })
            await page.getByRole('heading', { name: '登录' }).waitFor()

            const results = await new AxeBuilder({ page }).analyze()
            console.log(
              JSON.stringify({
                url: page.url(),
                violations: results.violations.length,
                incomplete: results.incomplete.length,
                passes: results.passes.length,
                violationIds: results.violations.map(({ id }) => id),
              }),
            )

            if (results.violations.length > 0) {
              console.error(JSON.stringify(results.violations, null, 2))
              process.exitCode = 1
            }
          } finally {
            await context.close()
            await browser.close()
          }
          NODE

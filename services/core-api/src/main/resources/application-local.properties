# Local synthetic acceptance uses one simple project-scoped test operator. It does not
# change authorization for production profiles or ordinary platform accounts.
platform.security.local-synthetic-bypass=true
platform.training-data-export.data-profile=synthetic
platform.object-storage.endpoint=${S3_ENDPOINT:http://localhost:19000}
platform.security.local-project-id=${DEV_PROJECT_ID:944a19eb-03b1-4b55-98fb-f8e108e23d92}
spring.datasource.hikari.maximum-pool-size=20

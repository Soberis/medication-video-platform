spring.application.name=platform-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:medication_platform}}
spring.datasource.username=${POSTGRES_USER:medication_local}
spring.datasource.password=${POSTGRES_PASSWORD:change-me-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:medication_local}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:change-me-local-only}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:medication}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

platform.messaging.relay-enabled=${PLATFORM_MESSAGING_RELAY_ENABLED:false}
platform.messaging.outbox.poll-delay=${OUTBOX_POLL_DELAY:PT1S}
platform.messaging.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
platform.messaging.outbox.claim-duration=${OUTBOX_CLAIM_DURATION:PT30S}
platform.messaging.outbox.retry-delay=${OUTBOX_RETRY_DELAY:PT5S}
platform.messaging.outbox.confirm-timeout=${OUTBOX_CONFIRM_TIMEOUT:PT5S}

platform.upload.batch-ttl=${UPLOAD_BATCH_TTL:PT24H}
platform.upload.part-authorization-ttl=${UPLOAD_PART_AUTHORIZATION_TTL:PT15M}
platform.upload.file-completion-lease=${UPLOAD_FILE_COMPLETION_LEASE:PT15M}
platform.upload.cleanup-enabled=${UPLOAD_CLEANUP_ENABLED:false}
platform.upload.cleanup-poll-delay=${UPLOAD_CLEANUP_POLL_DELAY:PT30S}
platform.upload.expiry-batch-size=${UPLOAD_EXPIRY_BATCH_SIZE:20}
platform.upload.cleanup-batch-size=${UPLOAD_CLEANUP_BATCH_SIZE:20}
platform.upload.cleanup-claim-duration=${UPLOAD_CLEANUP_CLAIM_DURATION:PT1M}
platform.upload.cleanup-retry-delay=${UPLOAD_CLEANUP_RETRY_DELAY:PT30S}
platform.upload.cleanup-max-attempts=${UPLOAD_CLEANUP_MAX_ATTEMPTS:5}
platform.upload.cleanup-alert.enabled=${UPLOAD_CLEANUP_ALERT_ENABLED:true}
platform.upload.cleanup-alert.poll-delay=${UPLOAD_CLEANUP_ALERT_POLL_DELAY:PT30S}
platform.upload.cleanup-alert.pending-age=${UPLOAD_CLEANUP_ALERT_PENDING_AGE:PT5M}
platform.playback.url-ttl=${PLAYBACK_URL_TTL:PT5M}
platform.security.local-bearer-token=${DEV_BEARER_TOKEN:}
platform.security.local-admin-bearer-token=${DEV_ADMIN_BEARER_TOKEN:}
platform.security.local-project-id=${DEV_PROJECT_ID:00000000-0000-0000-0000-000000000001}
platform.local-synthetic-project.enabled=${LOCAL_SYNTHETIC_PROJECT_ENABLED:true}
platform.security.local-worker-bearer-token=${MEDIA_WORKER_BEARER_TOKEN:}
platform.security.local-ai-worker-bearer-token=${AI_WORKER_BEARER_TOKEN:}
platform.security.local-export-worker-bearer-token=${EXPORT_WORKER_BEARER_TOKEN:}
platform.security.worker-jwt.issuer-uri=${WORKER_JWT_ISSUER_URI:}
platform.security.worker-jwt.jwk-set-uri=${WORKER_JWT_JWK_SET_URI:}
platform.security.worker-jwt.media-audience=${MEDIA_WORKER_JWT_AUDIENCE:}
platform.security.worker-jwt.export-audience=${EXPORT_WORKER_JWT_AUDIENCE:}
platform.security.worker-jwt.ai-audience=${AI_WORKER_JWT_AUDIENCE:}
platform.security.worker-jwt.clock-skew=${WORKER_JWT_CLOCK_SKEW:PT1M}
platform.security.bootstrap-admin-username=${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:}
platform.security.bootstrap-admin-password=${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.name=MVPSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PLATFORM_SESSION_COOKIE_SECURE:false}

platform.media-probe.lease-duration=${MEDIA_PROBE_LEASE_DURATION:PT30M}
platform.media-probe.heartbeat-interval=${MEDIA_PROBE_HEARTBEAT_INTERVAL:PT5M}
platform.media-probe.lease-grace=${MEDIA_PROBE_LEASE_GRACE:PT5M}
platform.media-probe.max-attempts=${MEDIA_PROBE_MAX_ATTEMPTS:3}
platform.media-probe.max-manual-replays=${MEDIA_PROBE_MAX_MANUAL_REPLAYS:2}
platform.media-probe.retry-base-delay=${MEDIA_PROBE_RETRY_BASE_DELAY:PT5S}
platform.media-probe.retry-max-delay=${MEDIA_PROBE_RETRY_MAX_DELAY:PT5M}
platform.media-probe.recovery-poll-delay=${MEDIA_PROBE_RECOVERY_POLL_DELAY:PT30S}
platform.media-probe.recovery-batch-size=${MEDIA_PROBE_RECOVERY_BATCH_SIZE:20}
platform.media-probe.input-authorization-ttl=${MEDIA_INPUT_AUTHORIZATION_TTL:PT15M}
platform.media-probe.result-clock-skew=${MEDIA_RESULT_CLOCK_SKEW:PT5M}
platform.media-probe.approved-software-digests=${MEDIA_WORKER_APPROVED_SOFTWARE_DIGEST:}
# Offline Hand Landmarker model identity. Leave empty until the model is deployed and hash-approved.
platform.ai.hand-pose.model-sha256=${AI_HAND_POSE_MODEL_SHA256:}
platform.ai.hand-pose.approved-camera-roles=${AI_HAND_POSE_APPROVED_CAMERA_ROLES:EGO}
platform.ai.hand-pose.enabled=${AI_HAND_POSE_ENABLED:false}
platform.ai.hand-pose.lease-duration=${AI_HAND_POSE_LEASE_DURATION:PT30M}
platform.ai.hand-pose.heartbeat-interval=${AI_HAND_POSE_HEARTBEAT_INTERVAL:PT5M}
platform.ai.hand-pose.input-authorization-ttl=${AI_HAND_POSE_INPUT_AUTHORIZATION_TTL:PT15M}
platform.ai.hand-pose.result-clock-skew=${AI_HAND_POSE_RESULT_CLOCK_SKEW:PT5M}
platform.dataset-export.lease-duration=${DATASET_EXPORT_LEASE_DURATION:PT2H}
platform.dataset-export.heartbeat-interval=${DATASET_EXPORT_HEARTBEAT_INTERVAL:PT5M}
platform.dataset-export.lease-grace=${DATASET_EXPORT_LEASE_GRACE:PT5M}
platform.dataset-export.max-attempts=${DATASET_EXPORT_MAX_ATTEMPTS:3}
platform.dataset-export.retry-base-delay=${DATASET_EXPORT_RETRY_BASE_DELAY:PT5S}
platform.dataset-export.retry-max-delay=${DATASET_EXPORT_RETRY_MAX_DELAY:PT5M}
platform.dataset-export.recovery-poll-delay=${DATASET_EXPORT_RECOVERY_POLL_DELAY:PT30S}
platform.dataset-export.recovery-batch-size=${DATASET_EXPORT_RECOVERY_BATCH_SIZE:20}
platform.dataset-export.input-authorization-ttl=${DATASET_EXPORT_INPUT_AUTHORIZATION_TTL:PT2H}
platform.dataset-export.output-part-authorization-ttl=${DATASET_EXPORT_OUTPUT_PART_AUTHORIZATION_TTL:PT15M}
platform.dataset-export.download-authorization-ttl=${DATASET_EXPORT_DOWNLOAD_AUTHORIZATION_TTL:PT5M}
platform.dataset-export.result-clock-skew=${DATASET_EXPORT_RESULT_CLOCK_SKEW:PT5M}
platform.dataset-export.approved-software-digests=${EXPORT_WORKER_APPROVED_SOFTWARE_DIGEST:}

platform.object-storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
platform.object-storage.region=${S3_REGION:us-east-1}
platform.object-storage.bucket=${S3_BUCKET:medication-platform-local}
platform.object-storage.access-key=${S3_ACCESS_KEY:change-me-local-only}
platform.object-storage.secret-key=${S3_SECRET_KEY:change-me-local-only}
platform.object-storage.path-style-access=${S3_PATH_STYLE_ACCESS:true}

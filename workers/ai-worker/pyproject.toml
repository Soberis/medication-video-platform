[project]
name = "medication-ai-worker"
version = "0.1.0"
description = "Offline MediaPipe Hand Landmarker candidate worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==18.0.0",
    "httpx==0.28.1",
    "mediapipe==1.0.0",
    "numpy==2.5.2",
    "pika==1.4.1",
]

[project.scripts]
ai-worker = "medication_ai_worker.__main__:main"

[dependency-groups]
dev = ["mypy==2.3.0", "pytest==9.1.1", "ruff==0.15.20"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medication_ai_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["av", "mediapipe", "numpy", "pika"]
ignore_missing_imports = true

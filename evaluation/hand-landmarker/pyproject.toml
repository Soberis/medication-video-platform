[project]
name = "medication-platform-hand-landmarker-evaluation"
version = "0.1.0"
description = "Offline, provenance-aware MediaPipe hand-landmarker benchmark"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["metrics.py", "evaluator.py", "compare_profiles.py", "tests"]
